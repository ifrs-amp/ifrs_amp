<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Database Staf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F1F4F3;
    --paper: #FFFFFF;
    --ink: #16302E;
    --ink-soft: #4B615F;
    --teal: #123F3E;
    --teal-2: #1E5B58;
    --amber: #B8863B;
    --amber-soft: #F1E4CB;
    --line: #DCE3E1;
    --danger: #A8453A;
    --danger-soft: #F5E1DE;
    --ok: #3F7A5C;
    --ok-soft: #E1EEE5;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(18,63,62,0.06), 0 6px 20px rgba(18,63,62,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--amber-soft); }
  .wrap{ max-width:1180px; margin:0 auto; padding:28px 20px 80px; }

  .home-link{
    background:none; border:none; color:var(--ink-soft); font-size:12px; font-weight:600;
    padding:0 0 8px; cursor:pointer; letter-spacing:.02em;
  }
  .home-link:hover{ color:var(--teal-2); }

  /* Landing page */
  .landing-wrap{ max-width:1180px; margin:0 auto; padding:0 20px 60px; }
  .hero{
    position:relative; overflow:hidden; border-radius:20px; margin:20px 0 32px;
    background:radial-gradient(circle at 20% 20%, #1C5D5A 0%, var(--teal) 55%, #0B302F 100%);
    padding:56px 32px 44px; text-align:center; color:#fff;
    box-shadow:0 20px 50px rgba(15,45,44,0.25);
  }
  .hero::before{
    content:""; position:absolute; inset:0; opacity:.16; pointer-events:none;
    background-image:radial-gradient(circle, #fff 1.4px, transparent 1.4px);
    background-size:22px 22px;
  }
  .hero-inner{ position:relative; z-index:1; }
  .hero h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:clamp(26px,4vw,38px);
    margin:0 0 10px; line-height:1.25;
  }
  .hero h1 .highlight{
    background:var(--amber); color:#3D2A0E; padding:3px 14px; border-radius:10px;
    display:inline-block; font-weight:700;
  }
  .hero .hero-sub{
    font-size:15px; color:#DCEDEA; margin:0 0 22px; font-weight:500;
  }
  .hero .hero-tag{
    display:inline-block; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.25);
    padding:8px 18px; border-radius:999px; font-size:13px; font-weight:600; color:#fff; margin-bottom:36px;
  }
  .hero-logo{
    width:auto; max-width:340px; margin:16px auto 8px; background:#fff;
    display:flex; align-items:center; justify-content:center; box-shadow:0 10px 30px rgba(0,0,0,0.2);
    border-radius:16px; padding:14px 20px;
  }
  .hero-logo img{ width:100%; height:auto; display:block; }
  .hero-quote{
    font-style:italic; font-size:13px; color:#CFE5E1; max-width:480px; margin:0 auto;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); border-radius:999px;
    padding:10px 20px;
  }

  .orbit-label{
    text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-soft); margin:0 0 26px;
  }
  .orbit-grid{
    display:grid; grid-template-columns:1fr 1fr 1fr; grid-template-rows:auto auto auto;
    align-items:center; justify-items:center; gap:22px; max-width:520px; margin:0 auto;
  }
  .orbit-circle-btn{
    width:120px; height:120px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(160deg, var(--teal) 0%, var(--teal-2) 100%); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    font-family:'Inter',sans-serif; font-weight:700; font-size:13px; text-align:center; padding:10px;
    box-shadow:0 12px 30px rgba(18,63,62,0.28); transition:transform .15s ease, box-shadow .15s ease;
  }
  .orbit-circle-btn:hover{ transform:translateY(-3px) scale(1.03); }
  .orbit-circle-btn svg{ width:30px; height:30px; }
  .orbit-center{ grid-column:2; grid-row:2; }
  .orbit-top-popup{
    grid-column:2; grid-row:1; display:flex; flex-direction:column; align-items:center;
    opacity:0; transform:translateY(14px) scale(.9); pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .orbit-top-popup.open{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .orbit-top-popup .orbit-circle-btn{
    width:100px; height:100px; font-size:12px;
    background:linear-gradient(160deg, var(--amber) 0%, #9C6B26 100%); color:#fff;
  }
  .orbit-right-popup{
    grid-column:3; grid-row:2; display:flex; flex-direction:column; align-items:center;
    opacity:0; transform:translateX(14px) scale(.9); pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .orbit-right-popup.open{ opacity:1; transform:translateX(0) scale(1); pointer-events:auto; }
  .orbit-right-popup .orbit-circle-btn{
    width:100px; height:100px; font-size:11.5px;
    background:linear-gradient(160deg, #3F7A5C 0%, #2A5A40 100%); color:#fff;
  }
  .orbit-left-popup{
    grid-column:1; grid-row:2; display:flex; flex-direction:column; align-items:center;
    opacity:0; transform:translateX(-14px) scale(.9); pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .orbit-left-popup.open{ opacity:1; transform:translateX(0) scale(1); pointer-events:auto; }
  .orbit-left-popup .orbit-circle-btn{
    width:100px; height:100px; font-size:11.5px;
    background:linear-gradient(160deg, #2E5490 0%, #1D3A66 100%); color:#fff;
  }
  .orbit-bottom-popup{
    grid-column:1 / span 3; grid-row:3; display:flex; flex-direction:column; align-items:center;
    opacity:0; transform:translateY(-14px) scale(.9); pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; margin-top:6px;
  }
  .orbit-bottom-popup.open{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .orbit-bottom-popup .orbit-circle-btn{
    width:100px; height:100px; font-size:11.5px;
    background:linear-gradient(160deg, #7A5133 0%, #4E3220 100%); color:#fff;
  }
  .orbit-slot-empty{ min-height:20px; grid-row:2; }
  .orbit-slot-left{ grid-column:1; }
  .orbit-slot-right{ grid-column:3; }
  .orbit-slot-bottom{ grid-column:1 / span 3; grid-row:3; min-height:20px; }
  @media (max-width:560px){
    .hero{ padding:40px 20px 32px; }
  }

  /* Header */
  .topbar{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:20px; padding-bottom:20px; margin-bottom:24px;
    border-bottom:1px solid var(--line);
  }
  .brand-eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--teal-2); margin:0 0 6px;
  }
  .brand-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:32px; margin:0;
    color:var(--teal); letter-spacing:-0.01em;
  }
  .brand-sub{ margin:6px 0 0; color:var(--ink-soft); font-size:14px; }
  .admin-zone{ display:flex; align-items:center; gap:10px; }
  .pill{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:6px 10px;
    border-radius:999px; border:1px solid var(--line); color:var(--ink-soft);
    display:flex; align-items:center; gap:6px; background:var(--paper);
  }
  .pill .dot{ width:7px; height:7px; border-radius:50%; background:#B7BFBD; }
  .pill.on .dot{ background:var(--ok); }
  .pill.on{ color:var(--ok); border-color:var(--ok-soft); background:var(--ok-soft); }

  button{ font-family:'Inter',sans-serif; cursor:pointer; }
  .btn{
    border:1px solid var(--teal); background:var(--teal); color:#fff;
    padding:9px 16px; border-radius:8px; font-size:13.5px; font-weight:600;
    transition:transform .12s ease, background .15s ease;
  }
  .btn:hover{ background:var(--teal-2); }
  .btn:active{ transform:scale(0.97); }
  .btn.secondary{ background:transparent; color:var(--teal); }
  .btn.secondary:hover{ background:#E7EEEC; }
  .btn.danger{ background:transparent; border-color:var(--danger-soft); color:var(--danger); }
  .btn.danger:hover{ background:var(--danger-soft); }
  .btn.small{ padding:6px 11px; font-size:12.5px; border-radius:7px; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }

  /* Stat cards */
  .stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-bottom:26px; }
  .section-label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); margin:0 0 10px;
  }
  .stat{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow);
  }
  /* Reminder banner */
  .reminder-card{
    background:var(--paper); border:1px solid var(--danger-soft); border-left:4px solid var(--danger);
    border-radius:var(--radius); padding:16px 18px; margin-bottom:22px; box-shadow:var(--shadow);
  }
  .reminder-card.warn{ border-left-color:var(--amber); border-color:var(--amber-soft); }
  .reminder-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .reminder-title{ font-family:'Fraunces',serif; font-weight:600; font-size:15.5px; color:var(--danger); display:flex; align-items:center; gap:8px; margin:0; }
  .reminder-title.warn{ color:#8A5F1E; }
  .reminder-sub{ font-size:12px; color:var(--ink-soft); margin:0 0 12px; }
  .reminder-list{ display:flex; flex-direction:column; gap:6px; }
  .reminder-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 10px; border-radius:7px; background:#FAF7F3; font-size:13px;
  }
  .reminder-item .who{ font-weight:600; color:var(--ink); }
  .reminder-item .doc{ color:var(--ink-soft); font-size:12px; }
  .reminder-status{ font-family:'IBM Plex Mono',monospace; font-size:11px; padding:3px 8px; border-radius:6px; white-space:nowrap; font-weight:600; }
  .reminder-status.expired{ background:var(--danger-soft); color:var(--danger); }
  .reminder-status.soon{ background:var(--amber-soft); color:#8A5F1E; }
  .stat.clickable{ cursor:pointer; transition:transform .12s ease, border-color .15s ease, box-shadow .15s ease; }
  .stat.clickable:hover{ border-color:var(--teal-2); transform:translateY(-2px); }
  .stat.clickable:active{ transform:translateY(0); }
  .stat.active{ border-color:var(--teal); background:#EFF6F4; box-shadow:0 0 0 2px rgba(18,63,62,0.12); }
  .stat .num{ font-family:'Fraunces',serif; font-size:28px; font-weight:600; color:var(--teal); line-height:1; }
  .stat .label{ font-size:12px; color:var(--ink-soft); margin-top:6px; }

  /* Toolbar */
  .toolbar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px;
    position:sticky; top:0; z-index:20; background:var(--bg);
    padding:12px 0; margin-top:-12px;
    box-shadow:0 8px 12px -8px rgba(18,63,62,0.08);
  }
  .search{
    flex:1; min-width:200px; position:relative;
  }
  .search input{
    width:100%; padding:10px 12px 10px 34px; border-radius:8px; border:1px solid var(--line);
    background:var(--paper); font-size:13.5px; color:var(--ink);
  }
  .search input:focus{ outline:none; border-color:var(--teal-2); }
  .search::before{
    content:"⌕"; position:absolute; left:11px; top:50%; transform:translateY(-50%);
    color:var(--ink-soft); font-size:16px;
  }
  select.filter{
    padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--paper);
    font-size:13px; color:var(--ink-soft); max-width:170px;
  }
  select.filter:focus{ outline:none; border-color:var(--teal-2); }

  /* Table */
  .table-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow-x:auto; overflow-y:hidden;
  }
  table{ width:100%; min-width:1100px; border-collapse:collapse; font-size:13.3px; }
  thead th{
    text-align:left; padding:11px 14px; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-soft); border-bottom:1px solid var(--line); background:#F8FAF9;
    font-weight:600; white-space:nowrap;
  }
  tbody td{ padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#FAFBFA; }
  .nama-cell{ font-family:'Fraunces',serif; font-weight:600; color:var(--teal); font-size:14.5px; }
  .sub{ color:var(--ink-soft); font-size:12px; margin-top:2px; }
  .badge{
    display:inline-block; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600;
    white-space:nowrap;
  }
  .badge.pns{ background:#E1EEE5; color:#2F6248; }
  .badge.pppk{ background:#EAF0F8; color:#2E5490; }
  .badge.pppkp{ background:#EDE7F5; color:#5A3E8C; }
  .badge.blud{ background:var(--amber-soft); color:#8A5F1E; }
  .badge.pt{ background:#F3ECE6; color:#7A5133; }
  .badge.aktif{ background:var(--ok-soft); color:var(--ok); }
  .badge.tidak-aktif{ background:var(--danger-soft); color:var(--danger); }
  .badge.cuti-tahunan{ background:#EAF0F8; color:#2E5490; }
  .badge.cuti-sakit{ background:var(--danger-soft); color:var(--danger); }
  .badge.cuti-melahirkan{ background:#EDE7F5; color:#5A3E8C; }
  .badge.cuti-menikah{ background:var(--amber-soft); color:#8A5F1E; }
  .badge.surat-tunda{ background:var(--amber-soft); color:#8A5F1E; }
  .badge.surat-revisi{ background:#EAF0F8; color:#2E5490; }

  /* Cuti table */
  .month-nav{
    display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:22px;
  }
  .month-nav button{
    width:36px; height:36px; border-radius:8px; border:1px solid var(--line); background:var(--paper);
    font-size:16px; color:var(--teal); cursor:pointer;
  }
  .month-nav button:hover{ background:#EFF6F4; }
  .month-nav .month-label{
    font-family:'Fraunces',serif; font-weight:600; font-size:18px; color:var(--teal); min-width:180px;
    text-align:center;
  }
  .cuti-table-wrap{ width:100%; }
  table.cuti-table{ border-collapse:collapse; font-size:11px; table-layout:fixed; width:100%; }
  table.cuti-table th, table.cuti-table td{
    border:1px solid var(--line); padding:4px 2px; text-align:center; overflow:hidden; text-overflow:ellipsis;
  }
  table.cuti-table thead th{
    background:#F8FAF9; color:var(--ink-soft); font-weight:600; font-size:9.5px; text-transform:uppercase;
  }
  table.cuti-table td.nama-col, table.cuti-table th.nama-col{ text-align:left; white-space:normal; width:9%; padding-left:6px; }
  table.cuti-table td.ruangan-col, table.cuti-table th.ruangan-col{ text-align:left; white-space:normal; width:8%; padding-left:6px; }
  table.cuti-table td.day-cell{ width:auto; color:var(--ink-soft); font-size:10px; }
  table.cuti-table td.day-cell.taken{ background:var(--danger); color:#fff; font-weight:700; border-color:var(--danger); }
  table.cuti-table td.day-cell.taken-excluded{ background:#E4E8E7; color:#8A9694; font-weight:600; }
  table.cuti-table td.day-cell-sunday{ background:#FBE1DE; }
  table.cuti-table td.day-cell-holiday{ background:#FADCEC; }
  table.cuti-table th.day-header-sunday{ background:var(--danger); color:#fff; }
  table.cuti-table th.day-header-holiday{ background:#D6488F; color:#fff; }
  table.cuti-table td.total-col, table.cuti-table th.total-col{ font-weight:700; color:var(--teal); background:#F3F8F7; width:4%; }
  table.cuti-table td.no-col, table.cuti-table th.no-col{ width:3%; color:var(--ink-soft); }
  table.cuti-table td.aksi-col, table.cuti-table th.aksi-col{ white-space:nowrap; width:11%; overflow:visible; }
  table.cuti-table td.aksi-col .row-actions{ display:flex; flex-direction:column; gap:4px; }
  table.cuti-table td.aksi-col .btn.small{ padding:3px 6px; font-size:10px; width:100%; }
  .row-actions{ display:flex; gap:6px; }
  .empty-row td{ padding:44px 14px; text-align:center; color:var(--ink-soft); }
  .empty-row .big{ font-family:'Fraunces',serif; font-size:17px; color:var(--teal); margin-bottom:4px; }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(18,45,44,0.45); display:flex; align-items:center;
    justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:var(--paper); width:100%; max-width:560px; border-radius:14px; padding:26px 28px 24px;
    box-shadow:0 20px 60px rgba(0,0,0,0.25); max-height:90vh; overflow-y:auto;
  }
  .modal h2{ font-family:'Fraunces',serif; font-size:22px; margin:0 0 4px; color:var(--teal); }
  .modal p.hint{ margin:0 0 18px; color:var(--ink-soft); font-size:13px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; letter-spacing:.02em; }
  .opt-tag{ font-weight:400; font-style:italic; color:#9AA8A6; text-transform:none; letter-spacing:0; }
  .doc-box{ background:#FAFBFA; border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .doc-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .doc-chip{ font-size:12.5px; color:var(--ok); font-weight:600; display:flex; align-items:center; gap:4px; }
  .link-manual-toggle{
    background:none; border:none; color:var(--ink-soft); font-size:11.5px; text-decoration:underline;
    cursor:pointer; padding:6px 0 0; display:block;
  }
  .link-manual-toggle:hover{ color:var(--teal-2); }
  .preview-modal{ max-width:820px; width:95vw; padding:16px 16px 20px; }
  .preview-modal iframe{ width:100%; height:70vh; border:none; border-radius:8px; background:#f2f2f2; }
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line); font-size:13.5px;
    font-family:'Inter',sans-serif; color:var(--ink); background:#FCFDFD;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--teal-2); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
  .close-x{
    position:absolute; top:16px; right:18px; background:none; border:none; font-size:20px;
    color:var(--ink-soft);
  }
  .modal{ position:relative; }
  textarea{ resize:vertical; min-height:60px; }

  .login-icon{
    width:40px; height:40px; border-radius:10px; background:var(--amber-soft); display:flex;
    align-items:center; justify-content:center; font-size:18px; margin-bottom:12px; color:#8A5F1E;
  }
  .error-text{ color:var(--danger); font-size:12.5px; margin-top:8px; }
  .footnote{
    text-align:center; color:var(--ink-soft); font-size:11.5px; margin-top:28px; line-height:1.6;
  }
  @media (max-width: 720px){
    .grid2{ grid-template-columns:1fr; }
    table{ font-size:12.5px; }
    thead th, tbody td{ padding:9px 10px; }
    .topbar{ flex-direction:column; align-items:flex-start; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const ADMIN_PASSWORD = "admin123"; // ganti sesuai kebutuhan Anda

// ============================================================
// KONFIGURASI GOOGLE SHEETS SEBAGAI DATABASE
// ============================================================
// 1. Buat Google Sheet baru.
// 2. Buka menu Extensions > Apps Script, hapus isi default, tempel kode
//    Apps Script yang saya berikan terpisah, lalu Deploy > New deployment >
//    Web app (Execute as: Me, Who has access: Anyone).
// 3. Salin URL Web App yang muncul, tempel di antara tanda kutip di bawah ini.
// 4. Kosongkan (biarkan "") jika ingin tetap pakai penyimpanan bawaan.
const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbyzlDLBQK5TjQzusMgkM_lmmX8AaA5JIdSwwuylCLVnSFs886TdFvjslC556ZALevw/exec";

async function sheetsGetList(table){
  const res = await fetch(`${SHEETS_API_URL}?action=getList&table=${encodeURIComponent(table)}&_=${Date.now()}`, { cache: 'no-store' });
  const data = await res.json();
  return data; // { table, rows } atau { error }
}
async function sheetsSetList(table, rows){
  const res = await fetch(SHEETS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight
    body: JSON.stringify({ action: 'setList', table, rows })
  });
  return await res.json();
}

// dataStore: otomatis pakai Google Sheets (sheet per tabel dengan header kolom asli)
// kalau SHEETS_API_URL sudah diisi; kalau belum, pakai penyimpanan bawaan (window.storage)
// supaya aplikasi tetap jalan.
const dataStore = {
  // table: nama sheet Google Sheets ("Staff","Cuti","LiburNasional","Surat")
  // legacyKey: nama key lama untuk penyimpanan bawaan (window.storage)
  async getList(table, legacyKey){
    if(SHEETS_API_URL){
      try{
        const res = await sheetsGetList(table);
        return (res && res.rows) ? res.rows : [];
      }catch(e){
        console.error('Gagal mengambil dari Google Sheets', e);
        return [];
      }
    }
    try{
      const res = await window.storage.get(legacyKey, true);
      return res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      return [];
    }
  },
  async setList(table, legacyKey, rows){
    if(SHEETS_API_URL){
      try{ return await sheetsSetList(table, rows); }
      catch(e){ console.error('Gagal menyimpan ke Google Sheets', e); return null; }
    }
    try{ return await window.storage.set(legacyKey, JSON.stringify(rows), true); }
    catch(e){ console.error('Gagal menyimpan data', e); return null; }
  }
};

async function uploadFileToDrive(base64, fileName, docType, mimeType){
  if(!SHEETS_API_URL) return { url:null, fileId:null, error:'SHEETS_API_URL belum diisi' };
  try{
    const res = await fetch(SHEETS_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'uploadFile', base64, fileName, docType, mimeType })
    });
    const data = await res.json();
    if(data && data.url){
      return { url: data.url, fileId: data.fileId || driveFileIdFromUrl(data.url), error:null };
    }
    console.error('Respons upload Drive tidak sesuai', data);
    return { url:null, fileId:null, error: (data && data.error) ? data.error : 'Respons server tidak sesuai' };
  }catch(e){
    console.error('Gagal upload ke Google Drive', e);
    return { url:null, fileId:null, error: e.message || String(e) };
  }
}

function driveFileIdFromUrl(url){
  if(!url) return null;
  const m = url.match(/\/file\/d\/([^/]+)/) || url.match(/[?&]id=([^&]+)/);
  return m ? m[1] : null;
}

function drivePreviewUrl(fileIdOrUrl){
  const fileId = fileIdOrUrl && fileIdOrUrl.startsWith('http') ? driveFileIdFromUrl(fileIdOrUrl) : fileIdOrUrl;
  return fileId ? `https://drive.google.com/file/d/${fileId}/preview` : null;
}

function openFilePreviewModal(fileIdOrUrl, fallbackUrl){
  const embedUrl = drivePreviewUrl(fileIdOrUrl);
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'file-preview-overlay';
  wrap.innerHTML = `
    <div class="modal preview-modal">
      <button class="close-x" id="preview-close">×</button>
      <h2 style="margin-bottom:12px;">Pratinjau File</h2>
      ${embedUrl
        ? `<iframe src="${embedUrl}" allow="autoplay"></iframe>`
        : `<p class="hint">Pratinjau tidak tersedia. <a href="${escapeHtml(fallbackUrl || '')}" target="_blank" rel="noopener">Buka file di tab baru</a>.</p>`}
    </div>
  `;
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  document.getElementById('preview-close').addEventListener('click', close);
  wrap.addEventListener('click', e => { if(e.target.id === 'file-preview-overlay') close(); });
}

function uid(){ return 's_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

const REMINDER_THRESHOLD_DAYS = 90; // ambang pengingat: 90 hari (3 bulan) sebelum kadaluarsa

function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T00:00:00');
  if(isNaN(target.getTime())) return null;
  return Math.round((target - today) / 86400000);
}

function getExpiryReminders(){
  const items = [];
  state.staff.forEach(s => {
    if(s.tglKadaluarsaSTR){
      const d = daysUntil(s.tglKadaluarsaSTR);
      if(d !== null && d <= REMINDER_THRESHOLD_DAYS) items.push({ nama:s.nama, jenis:'STR', nomor:s.nomorSTR, tanggal:s.tglKadaluarsaSTR, sisaHari:d, link:s.linkDokumenSTR });
    }
    if(s.tglKadaluarsaSIPA){
      const d = daysUntil(s.tglKadaluarsaSIPA);
      if(d !== null && d <= REMINDER_THRESHOLD_DAYS) items.push({ nama:s.nama, jenis:'SIPA', nomor:s.nomorSIPA, tanggal:s.tglKadaluarsaSIPA, sisaHari:d, link:s.linkDokumenSIPA });
    }
  });
  items.sort((a,b) => a.sisaHari - b.sisaHari);
  return items;
}

function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); }

function parseDateLocal(dateStr){
  if(!dateStr) return null;
  const datePart = String(dateStr).split('T')[0];
  const d = new Date(datePart + 'T00:00:00');
  return isNaN(d.getTime()) ? null : d;
}

function dateOnly(val){
  if(!val) return '';
  return String(val).split('T')[0];
}

function formatDateISO(d){
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function countDaysInclusive(startStr, endStr){
  const start = parseDateLocal(startStr);
  const end = parseDateLocal(endStr);
  if(!start || !end) return 0;
  const diff = Math.round((end - start) / 86400000) + 1;
  return diff > 0 ? diff : 0;
}

function isCountedDay(dateObj, shift, holidayList){
  if(shift === 'Cuti Melahirkan') return true; // dihitung penuh, tanpa kecuali (akhir pekan/libur nasional tetap terhitung)
  const dow = dateObj.getDay(); // 0 = Minggu, 6 = Sabtu
  const dateStr = formatDateISO(dateObj);
  if(holidayList.includes(dateStr)) return false;
  if(shift === 'Non Shift') return dow >= 1 && dow <= 5;
  if(shift === 'Shift') return dow >= 1 && dow <= 6;
  return true; // fallback untuk data lama tanpa keterangan shift
}

function countCutiDays(entry, holidayList){
  const start = parseDateLocal(entry.tglMulai);
  const end = parseDateLocal(entry.tglSelesai);
  if(!start || !end) return 0;
  if(!entry.shift) return countDaysInclusive(entry.tglMulai, entry.tglSelesai);
  let count = 0;
  const cursor = new Date(start);
  while(cursor <= end){
    if(isCountedDay(cursor, entry.shift, holidayList)) count++;
    cursor.setDate(cursor.getDate() + 1);
  }
  return count;
}

function getDayNumbersForEntry(entry, year, month){
  const start = parseDateLocal(entry.tglMulai);
  const end = parseDateLocal(entry.tglSelesai);
  if(!start || !end) return [];
  const days = [];
  const cursor = new Date(start);
  while(cursor <= end){
    if(cursor.getFullYear() === year && (cursor.getMonth() + 1) === month){
      const counted = entry.shift ? isCountedDay(cursor, entry.shift, state.liburNasional) : true;
      days.push({ day: cursor.getDate(), counted });
    }
    cursor.setDate(cursor.getDate() + 1);
  }
  return days;
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function buildTextWithLines(content){
  const items = content.items;
  const lines = [];
  let currentY = null;
  let currentLine = [];
  items.forEach(item => {
    const y = item.transform[5];
    if(currentY === null || Math.abs(y - currentY) > 2){
      if(currentLine.length) lines.push(currentLine.join(' '));
      currentLine = [item.str];
      currentY = y;
    } else {
      currentLine.push(item.str);
    }
  });
  if(currentLine.length) lines.push(currentLine.join(' '));
  return lines.join('\n');
}

async function extractPdfFirstPageText(arrayBuffer){
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const page = await pdf.getPage(1);
  const content = await page.getTextContent();
  return buildTextWithLines(content);
}

async function ocrPdfFirstPage(arrayBuffer, onProgress){
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 2.2 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;

  const result = await Tesseract.recognize(canvas, 'ind+eng', {
    logger: m => {
      if(onProgress && m.status === 'recognizing text'){
        onProgress(Math.round((m.progress || 0) * 100));
      }
    }
  });
  return result.data.text;
}

function extractSuratFields(text){
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

  // Cocok hanya jika label diikuti tanda ":" atau "-" pada baris yang sama, contoh: "Nomor : B-152/RSAMP/..."
  function findLabelValueStrict(labelRegex){
    for(const line of lines){
      const m = line.match(labelRegex);
      if(m && m[1] && m[1].trim()) return m[1].trim();
    }
    return '';
  }

  // Cocok jika baris HANYA berisi label itu sendiri (tanpa kata lain), nilainya diambil dari baris berikutnya
  function findLabelOnNextLine(exactLabelRegex){
    for(let i = 0; i < lines.length; i++){
      if(exactLabelRegex.test(lines[i]) && lines[i + 1]){
        return lines[i + 1].trim();
      }
    }
    return '';
  }

  const nomorSurat =
    findLabelValueStrict(/^Nomor\s*[:\-]\s*(.+)$/i) ||
    findLabelValueStrict(/^No\.?\s*[:\-]\s*(.+)$/i) ||
    findLabelOnNextLine(/^Nomor$/i) ||
    findLabelOnNextLine(/^No\.?$/i);

  const hal =
    findLabelValueStrict(/^Hal\s*[:\-]\s*(.+)$/i) ||
    findLabelValueStrict(/^Perihal\s*[:\-]\s*(.+)$/i) ||
    findLabelOnNextLine(/^Hal$/i) ||
    findLabelOnNextLine(/^Perihal$/i);

  const bulan = '(Januari|Februari|Maret|April|Mei|Juni|Juli|Agustus|September|Oktober|November|Desember)';
  const bulanRe = new RegExp('(\\d{1,2})\\s+' + bulan + '\\s+(\\d{4})', 'i');
  let tanggalSurat = '';
  for(const line of lines){
    const m = line.match(bulanRe);
    if(m){ tanggalSurat = `${m[1]} ${m[2]} ${m[3]}`; break; }
  }

  return { nomorSurat, hal, tanggalSurat };
}

function base64ToBlobUrl(base64, mime){
  const byteChars = atob(base64);
  const byteNumbers = new Array(byteChars.length);
  for(let i = 0; i < byteChars.length; i++){ byteNumbers[i] = byteChars.charCodeAt(i); }
  const byteArray = new Uint8Array(byteNumbers);
  const blob = new Blob([byteArray], { type: mime || 'application/pdf' });
  return URL.createObjectURL(blob);
}

const SURAT_MAX_SIZE_BYTES = 10 * 1024 * 1024; // 10 MB

const SURAT_CHUNK_SIZE = 1 * 1024 * 1024; // ~1 MB per bagian, lebih aman dari batas per-item penyimpanan

function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

async function storageSetWithRetry(key, value, attempts = 3){
  for(let attempt = 1; attempt <= attempts; attempt++){
    try{
      const result = await window.storage.set(key, value, true);
      if(result) return true;
    }catch(e){
      console.error(`storage.set gagal (percobaan ${attempt})`, key, e);
    }
    if(attempt < attempts) await sleep(400 * attempt);
  }
  return false;
}

async function storageGetWithRetry(key, attempts = 3){
  for(let attempt = 1; attempt <= attempts; attempt++){
    try{
      const res = await window.storage.get(key, true);
      if(res && res.value) return res.value;
    }catch(e){
      console.error(`storage.get gagal (percobaan ${attempt})`, key, e);
    }
    if(attempt < attempts) await sleep(400 * attempt);
  }
  return null;
}

async function saveFileChunked(id, base64){
  const chunks = [];
  for(let i = 0; i < base64.length; i += SURAT_CHUNK_SIZE){
    chunks.push(base64.slice(i, i + SURAT_CHUNK_SIZE));
  }
  for(let i = 0; i < chunks.length; i++){
    const ok = await storageSetWithRetry(`surat-file:${id}:${i}`, chunks[i]);
    if(!ok){
      throw new Error(`Gagal menyimpan bagian file ke-${i + 1} dari ${chunks.length} setelah beberapa kali percobaan`);
    }
  }
  // Verifikasi: baca ulang dan bandingkan panjang totalnya sebelum dianggap berhasil
  const verify = await loadFileChunked(id, chunks.length);
  if(verify.length !== base64.length){
    throw new Error('Verifikasi file gagal — data yang tersimpan tidak lengkap.');
  }
  return chunks.length;
}

async function loadFileChunked(id, chunkCount){
  let combined = '';
  for(let i = 0; i < chunkCount; i++){
    const value = await storageGetWithRetry(`surat-file:${id}:${i}`);
    if(!value) throw new Error('Bagian file tidak lengkap (bagian ke-' + (i + 1) + ' hilang)');
    combined += value;
  }
  return combined;
}

function waitForLib(checkFn, timeoutMs){
  return new Promise(resolve => {
    const start = Date.now();
    const interval = setInterval(() => {
      if(checkFn()){
        clearInterval(interval);
        resolve(true);
      } else if(Date.now() - start > timeoutMs){
        clearInterval(interval);
        resolve(false);
      }
    }, 250);
  });
}

async function handleSuratFileSelected(file){
  if(!file) return;
  if(file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')){
    alert('File harus berformat PDF.');
    return;
  }
  if(file.size > SURAT_MAX_SIZE_BYTES){
    alert(`Ukuran file (${(file.size / (1024*1024)).toFixed(1)} MB) melebihi batas maksimal 10 MB. Silakan upload file PDF yang lebih kecil.`);
    return;
  }

  state.suratUploading = true;
  state.suratUploadStatus = 'Menyiapkan pembaca PDF…';
  render();

  let pdfReady = typeof pdfjsLib !== 'undefined';
  if(!pdfReady){
    pdfReady = await waitForLib(() => typeof pdfjsLib !== 'undefined', 6000);
  }

  let fields = { nomorSurat:'', hal:'', tanggalSurat:'' };
  let usedOcr = false;
  let skippedExtraction = false;

  if(pdfReady){
    state.suratUploadStatus = 'Membaca teks PDF…';
    render();
    try{
      const arrayBuffer = await file.arrayBuffer();
      const text = await extractPdfFirstPageText(arrayBuffer);
      fields = extractSuratFields(text);
    }catch(err){
      console.error('Gagal membaca isi PDF', err);
    }
  } else {
    skippedExtraction = true;
    console.error('Modul pdf.js tidak berhasil dimuat, upload dilanjutkan tanpa baca otomatis.');
  }

  const foundNothing = !fields.tanggalSurat && !fields.hal && !fields.nomorSurat;
  if(pdfReady && foundNothing && typeof Tesseract !== 'undefined'){
    usedOcr = true;
    try{
      state.suratUploadStatus = 'Sepertinya ini hasil scan — membaca dengan OCR… 0%';
      render();
      const arrayBuffer2 = await file.arrayBuffer();
      const ocrText = await ocrPdfFirstPage(arrayBuffer2, pct => {
        state.suratUploadStatus = `Sepertinya ini hasil scan — membaca dengan OCR… ${pct}%`;
        render();
      });
      fields = extractSuratFields(ocrText);
    }catch(err){
      console.error('Gagal OCR PDF', err);
    }
  }

  state.suratUploadStatus = 'Menyimpan file…';
  render();
  let base64 = null;
  try{
    base64 = await fileToBase64(file);
  }catch(err){
    console.error('Gagal membaca file', err);
  }

  const entry = {
    id: uid(),
    tanggalSurat: fields.tanggalSurat,
    hal: fields.hal,
    nomorSurat: fields.nomorSurat,
    fileName: file.name,
    uploadedAt: new Date().toISOString()
  };

  if(base64 && SHEETS_API_URL){
    state.suratUploadStatus = 'Mengunggah file ke Google Drive…';
    render();
    const uploadResult = await uploadFileToDrive(base64, file.name, 'surat', 'application/pdf');
    if(uploadResult.url){
      entry.linkGoogleDrive = uploadResult.url;
      entry.fileId = uploadResult.fileId;
    } else {
      alert(`Gagal mengunggah file ke Google Drive.\n\nPenyebab: ${uploadResult.error || 'tidak diketahui'}\n\nData surat tetap tersimpan tanpa file — silakan lengkapi link Google Drive manual lewat tombol Edit, atau coba upload ulang.`);
    }
  } else if(base64){
    try{
      entry.fileChunks = await saveFileChunked(entry.id, base64);
    }catch(e){
      console.error('Gagal menyimpan file PDF', e);
      alert('Data surat tersimpan, tetapi file PDF gagal disimpan sepenuhnya.');
    }
  }

  state.suratList.push(entry);
  await saveSuratList();

  state.suratUploading = false;
  state.suratUploadStatus = '';
  render();

  if(skippedExtraction){
    alert('Surat berhasil diupload. Modul pembaca PDF tidak berhasil dimuat (kemungkinan koneksi internet lambat atau ada pemblokiran jaringan), jadi Tanggal/Hal/Nomor perlu diisi manual lewat tombol "Edit" pada baris surat tersebut.');
  } else if(!fields.tanggalSurat && !fields.hal && !fields.nomorSurat){
    alert(`Surat berhasil diupload${usedOcr ? ' (sudah dicoba dengan OCR)' : ''}, tapi sistem tetap tidak menemukan Tanggal/Hal/Nomor secara otomatis dari isi PDF ini. Silakan klik "Edit" pada baris surat tersebut untuk melengkapinya.`);
  }
}

async function viewSuratFile(id){
  try{
    const entry = state.suratList.find(x => x.id === id);
    let base64 = null;
    if(entry && entry.fileChunks){
      base64 = await loadFileChunked(id, entry.fileChunks);
    } else {
      const res = await window.storage.get(`surat-file:${id}`, true);
      base64 = res && res.value ? res.value : null;
    }
    if(!base64){
      alert('File PDF untuk surat ini tidak tersimpan (kemungkinan gagal saat proses upload). Silakan hapus data surat ini lalu upload ulang file PDF-nya.');
      return;
    }
    const url = base64ToBlobUrl(base64);
    window.open(url, '_blank');
  }catch(e){
    console.error(e);
    alert('File PDF gagal dibuka — kemungkinan filenya tidak tersimpan lengkap saat upload. Silakan hapus data surat ini lalu upload ulang file PDF-nya.');
  }
}

function keteranganCutiBadgeClass(k){
  if(k === 'Cuti Tahunan') return 'cuti-tahunan';
  if(k === 'Cuti Sakit') return 'cuti-sakit';

function normalizeJenisKelamin(raw){
  const v = (raw || '').toString().trim().toLowerCase();
  if(['l','laki-laki','laki laki','pria','male','m'].includes(v)) return 'L';
  if(['p','perempuan','wanita','female','f'].includes(v)) return 'P';
  return '';
}

function normalizePendidikan(raw){
  const v = (raw || '').toString().trim();
  if(!v) return '';
  const matched = PENDIDIKAN_OPTIONS.find(o => o.toLowerCase() === v.toLowerCase());
  return matched || v;
}

function normalizeStatusPekerjaan(raw){
  const v = (raw || '').toString().trim();
  if(!v) return '';
  const matched = STATUS_OPTIONS.find(o => o.toLowerCase() === v.toLowerCase());
  return matched || '';
}

function normalizeTanggalLahir(raw){
  const v = (raw || '').toString().trim();
  if(!v) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  let d = null;
  const dmy = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(dmy){
    d = new Date(Number(dmy[3]), Number(dmy[2]) - 1, Number(dmy[1]));
  } else {
    d = new Date(v);
  }
  if(!d || isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  if(typeof XLSX === 'undefined'){
    alert('Modul Excel belum siap dimuat, coba lagi sesaat lagi.');
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = async (evt) => {
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type:'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });

      if(rows.length === 0){
        alert('File kosong atau format tidak sesuai template.');
        return;
      }

      let imported = 0, skipped = 0;
      rows.forEach(row => {
        const nama = (row['Nama Pegawai'] || row['Nama Staf'] || row['Nama'] || '').toString().trim();
        if(!nama || /^(contoh|catatan)/i.test(nama)) { skipped++; return; }

        state.staff.push({
          id: uid(),
          nama,
          nip: (row['NIP'] || '').toString().trim(),
          tempatLahir: '', tanggalLahir: normalizeTanggalLahir(row['Tanggal Lahir']), email: '',
          jenisKelamin: normalizeJenisKelamin(row['Jenis Kelamin']),
          pendidikan: normalizePendidikan(row['Pendidikan']),
          profesi: (row['Profesi'] || '').toString().trim(),
          statusPekerjaan: normalizeStatusPekerjaan(row['Status']),
          jabatanSK: (row['Jabatan Sesuai SK'] || '').toString().trim(),
          jabatanRuangan: (row['Jabatan Saat Ini'] || '').toString().trim(),
          keterangan: '',
          nomorSTR: (row['Nomor STR'] || '').toString().trim(), tglKadaluarsaSTR: '', linkDokumenSTR: '',
          nomorSIPA: (row['Nomor SIPA'] || '').toString().trim(), tglKadaluarsaSIPA: '', linkDokumenSIPA: ''
        });
        imported++;
      });

      if(imported > 0) await saveData();
      render();
      alert(`Berhasil mengimpor ${imported} data staf.${skipped > 0 ? ` (${skipped} baris dilewati karena nama kosong/contoh)` : ''}`);
    }catch(err){
      console.error('Gagal impor file', err);
      alert('Gagal membaca file. Pastikan menggunakan template yang disediakan dan formatnya tidak diubah.');
    }finally{
      e.target.value = '';
    }
  };
  reader.readAsArrayBuffer(file);
}

function docStatus(expiryDate){
  if(!expiryDate) return null;
  const d = daysUntil(expiryDate);
  if(d === null) return null;
  return d < 0 ? 'tidak-aktif' : 'aktif';
}

function renderDocCell(nomor, expiryDate){
  if(!nomor && !expiryDate) return '<span class="sub">—</span>';
  const status = docStatus(expiryDate);
  const badge = status === 'aktif'
    ? '<span class="badge aktif">Aktif</span>'
    : status === 'tidak-aktif'
      ? '<span class="badge tidak-aktif">Tidak Aktif</span>'
      : '';
  return `
    ${nomor ? `<div>${escapeHtml(nomor)}</div>` : '<div class="sub">Nomor belum diisi</div>'}
    ${expiryDate ? `<div class="sub">s.d. ${formatTanggal(expiryDate)}</div>` : ''}
    ${badge ? `<div style="margin-top:3px;">${badge}</div>` : ''}
  `;
}

function statusBadgeClass(status){
  switch(status){
    case 'PNS': return 'pns';
    case 'PPPK': return 'pppk';
    case 'PPPK Paruh Waktu': return 'pppkp';
    case 'BLUD': return 'blud';
    case 'PT': return 'pt';
    default: return 'pt';
  }
}

function escapeHtml(str){
  if(str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function getFiltered(){
  const q = state.search.trim().toLowerCase();
  return state.staff.filter(s => {
    if(state.filterStatus && s.statusPekerjaan !== state.filterStatus) return false;
    if(state.filterPendidikan && s.pendidikan !== state.filterPendidikan) return false;
    if(state.filterProfesi === 'S2 Farmasi'){
      if((s.pendidikan||'').trim().toLowerCase() !== 'S2 Farmasi + Apoteker'.toLowerCase()) return false;
    } else if(state.filterProfesi && (s.profesi||'').trim().toLowerCase() !== state.filterProfesi.toLowerCase()) return false;
    if(!q) return true;
    const hay = [s.nama, s.nip, s.email, s.jabatanSK, s.jabatanRuangan, s.tempatLahir].join(' ').toLowerCase();
    return hay.includes(q);
  }).sort((a,b) => (a.nama||'').localeCompare(b.nama||''));
}

function computeStats(){
  const total = state.staff.length;
  const byStatus = {};
  STATUS_OPTIONS.forEach(s => byStatus[s] = 0);
  state.staff.forEach(s => { if(byStatus[s.statusPekerjaan] !== undefined) byStatus[s.statusPekerjaan]++; });
  const perempuan = state.staff.filter(s => s.jenisKelamin === 'P').length;
  const lakiLaki = state.staff.filter(s => s.jenisKelamin === 'L').length;
  const byProfesi = {};
  PROFESI_CATEGORIES.forEach(p => byProfesi[p] = 0);
  state.staff.forEach(s => {
    if((s.pendidikan || '').trim().toLowerCase() === 'S2 Farmasi + Apoteker'.toLowerCase()){
      byProfesi['S2 Farmasi']++;
      return;
    }
    const p = (s.profesi || '').trim();
    const matched = PROFESI_CATEGORIES.find(c => c.toLowerCase() === p.toLowerCase());
    if(matched && matched !== 'S2 Farmasi') byProfesi[matched]++;
  });
  return { total, byStatus, perempuan, lakiLaki, byProfesi };
}

function computeRekapCuti(year){
  const map = {};
  state.cutiStaf.forEach(entry => {
    const start = parseDateLocal(entry.tglMulai);
    if(!start || start.getFullYear() !== year) return;
    const key = (entry.namaPetugas || '').trim().toLowerCase() + '|' + (entry.depoRuangan || '').trim().toLowerCase();
    if(!map[key]){
      map[key] = {
        namaPetugas: entry.namaPetugas,
        depoRuangan: entry.depoRuangan,
        pengajuan: 0,
        total: 0,
        breakdown: {}
      };
      KETERANGAN_CUTI_OPTIONS.forEach(k => { map[key].breakdown[k] = 0; });
    }
    const days = countCutiDays(entry, state.liburNasional);
    map[key].total += days;
    map[key].pengajuan++;
    if(map[key].breakdown[entry.keterangan] !== undefined){
      map[key].breakdown[entry.keterangan] += days;
    }
  });
  return Object.values(map).sort((a, b) => (a.namaPetugas || '').localeCompare(b.namaPetugas || ''));
}

    if(!file) return;
    if(file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')){
      alert('File harus berformat PDF.');
      return;
    }
    if(file.size > SURAT_MAX_SIZE_BYTES){
      alert(`Ukuran file (${(file.size / (1024*1024)).toFixed(1)} MB) melebihi batas maksimal 10 MB.`);
      return;
    }
    if(!SHEETS_API_URL){
      alert('Upload otomatis ke Google Drive belum aktif.');
      return;
    }
    const statusEl = document.getElementById('upload-surat-edit-status');
    btnUploadEdit.disabled = true;
    statusEl.textContent = 'Mengunggah ke Google Drive…';
    try{
      const base64 = await fileToBase64(file);
      const result = await uploadFileToDrive(base64, file.name, 'surat', 'application/pdf');
      if(result.url){
        document.getElementById('sf-drive').value = result.url;
        s.fileId = result.fileId || '';
        s.fileName = file.name;
        statusEl.textContent = '✓ File berhasil diupload. Klik "Simpan Perubahan" untuk menyimpan.';
      } else {
        statusEl.textContent = '';
        alert(`Gagal mengunggah file ke Google Drive.\n\nPenyebab: ${result.error || 'tidak diketahui'}`);
      }
    }catch(err){
      console.error(err);
      statusEl.textContent = '';
      alert('Gagal mengunggah file.');
    }
    btnUploadEdit.disabled = false;
  });

  document.getElementById('surat-save').addEventListener('click', async () => {
    s.tanggalSurat = document.getElementById('sf-tanggal').value.trim();
    s.hal = document.getElementById('sf-hal').value.trim();
    s.nomorSurat = document.getElementById('sf-nomor').value.trim();
    s.linkGoogleDrive = document.getElementById('sf-drive').value.trim();
    await saveSuratList();
    const overlay = document.getElementById('overlay');
    if(overlay) overlay.remove();
    state.modal = null;
    state.suratEditingId = null;
    render();
  });
}

function renderSuratDeleteModal(){
  const s = state.suratList.find(x => x.id === state.suratDeletingId);
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'overlay';
  wrap.innerHTML = `
    <div class="modal" style="max-width:400px;">
      <button class="close-x" id="modal-close">×</button>
      <h2>Hapus surat?</h2>
      <p class="hint">Surat <strong>${escapeHtml(s ? s.hal : '')}</strong> beserta filenya akan dihapus permanen.</p>
      <div class="modal-actions">
        <button class="btn secondary" id="delete-cancel">Batal</button>
        <button class="btn" id="delete-confirm" style="background:var(--danger); color:#fff; border-color:var(--danger);">Ya, Hapus</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  const cancel = () => {
    const overlay = document.getElementById('overlay');
    if(overlay) overlay.remove();
    state.modal = null;
    state.suratDeletingId = null;
    render();
  };
  document.getElementById('modal-close').addEventListener('click', cancel);
  document.getElementById('delete-cancel').addEventListener('click', cancel);
  wrap.addEventListener('click', e => { if(e.target.id === 'overlay') cancel(); });
  document.getElementById('delete-confirm').addEventListener('click', async () => {
    const id = state.suratDeletingId;
    const entry = state.suratList.find(x => x.id === id);
    state.suratList = state.suratList.filter(x => x.id !== id);
    await saveSuratList();
    try{
      if(entry && entry.fileChunks){
        for(let i = 0; i < entry.fileChunks; i++){
          await window.storage.delete(`surat-file:${id}:${i}`, true);
        }
      } else {
        await window.storage.delete(`surat-file:${id}`, true);
      }
    }catch(e){}
    cancel();
  });
}

function renderCutiFormModal(){
  const editing = state.cutiEditingId ? state.cutiStaf.find(x => x.id === state.cutiEditingId) : null;
  const r = editing || { namaPetugas:'', depoRuangan:'', keterangan:'', shift:'', tglMulai:'', tglSelesai:'' };

  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'overlay';
  wrap.innerHTML = `
    <div class="modal">
      <button class="close-x" id="modal-close">×</button>
      <h2>${editing ? 'Edit Cuti Staf' : 'Tambah Cuti Staf'}</h2>
      <p class="hint">${editing ? 'Perbarui data cuti di bawah ini.' : 'Lengkapi data cuti staf.'}</p>
      <form id="cuti-form">
        <div class="field">
          <label>Nama Petugas</label>
          <input type="text" id="cf-nama" value="${escapeHtml(r.namaPetugas)}" required>
        </div>
        <div class="field">
          <label>Depo/Ruangan</label>
          <input type="text" id="cf-ruangan" value="${escapeHtml(r.depoRuangan)}">
        </div>
        <div class="grid2">
          <div class="field">
            <label>Keterangan Cuti</label>
            <select id="cf-keterangan">
              <option value="">Pilih…</option>
              ${KETERANGAN_CUTI_OPTIONS.map(o => `<option value="${escapeHtml(o)}" ${r.keterangan===o?'selected':''}>${o}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Keterangan Shift</label>
            <select id="cf-shift">
              <option value="">Pilih…</option>
              ${SHIFT_OPTIONS.map(o => `<option value="${escapeHtml(o)}" ${r.shift===o?'selected':''}>${o}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="grid2">
          <div class="field">
            <label>Tanggal Mulai Cuti</label>
            <input type="date" id="cf-mulai" value="${escapeHtml(dateOnly(r.tglMulai))}" required>
          </div>
          <div class="field">
            <label>Tanggal Selesai Cuti</label>
            <input type="date" id="cf-selesai" value="${escapeHtml(dateOnly(r.tglSelesai))}" required>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="form-cancel">Batal</button>
          <button type="submit" class="btn">${editing ? 'Simpan Perubahan' : 'Tambah Cuti'}</button>
        </div>
      </form>
    </div>
  `;
  document.body.appendChild(wrap);
  document.getElementById('modal-close').addEventListener('click', closeCutiModal);
  document.getElementById('form-cancel').addEventListener('click', closeCutiModal);
  wrap.addEventListener('click', e => { if(e.target.id === 'overlay') closeCutiModal(); });
  document.getElementById('cf-nama').focus();

  document.getElementById('cuti-form').addEventListener('submit', async e => {
    e.preventDefault();
    const data = {
      namaPetugas: document.getElementById('cf-nama').value.trim(),
      depoRuangan: document.getElementById('cf-ruangan').value.trim(),
      keterangan: document.getElementById('cf-keterangan').value,
      shift: document.getElementById('cf-shift').value,
      tglMulai: document.getElementById('cf-mulai').value,
      tglSelesai: document.getElementById('cf-selesai').value
    };
    if(!data.namaPetugas){ alert('Nama petugas wajib diisi.'); return; }
    if(!data.tglMulai || !data.tglSelesai){ alert('Tanggal mulai dan selesai cuti wajib diisi.'); return; }
    if(data.tglSelesai < data.tglMulai){ alert('Tanggal selesai tidak boleh sebelum tanggal mulai.'); return; }
    if(!data.shift){ alert('Keterangan Shift wajib dipilih agar total hari cuti terhitung dengan benar.'); return; }

    if(editing){
      const idx = state.cutiStaf.findIndex(x => x.id === editing.id);
      state.cutiStaf[idx] = { ...editing, ...data };
    } else {
      state.cutiStaf.push({ id: uid(), ...data });
    }
    closeCutiModal();
    await saveCutiData();
    render();
  });
}

  wrap.innerHTML = `
    <div class="modal" style="max-width:440px;">
      <button class="close-x" id="modal-close">×</button>
      <h2>📅 Hari Libur Nasional</h2>

      </div>

        ${sorted.length === 0 ? '<p class="sub" style="text-align:center; padding:16px 0;">Belum ada tanggal libur nasional yang ditambahkan.</p>' : sorted.map(d => `
          <div style="display:flex; align-items:center; justify-content:space-between; background:#FAFBFA; border:1px solid var(--line); border-radius:8px; padding:8px 12px;">

          </div>
        `).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn" id="libur-close">Selesai</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  document.getElementById('modal-close').addEventListener('click', closeCutiModal);
  document.getElementById('libur-close').addEventListener('click', closeCutiModal);
  wrap.addEventListener('click', e => { if(e.target.id === 'overlay') closeCutiModal(); });

  document.getElementById('libur-add').addEventListener('click', async () => {
    const val = document.getElementById('libur-input').value;
    if(!val){ alert('Pilih tanggal terlebih dahulu.'); return; }
    if(state.liburNasional.includes(val)){ alert('Tanggal tersebut sudah ada dalam daftar.'); return; }
    state.liburNasional.push(val);
    await saveLiburNasional();
    render();
  });

  document.querySelectorAll('[data-libur-remove]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const val = btn.getAttribute('data-libur-remove');
      state.liburNasional = state.liburNasional.filter(d => d !== val);
      await saveLiburNasional();
      render();
    });
  });
}

function renderGuideModal(){
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'overlay';
  wrap.innerHTML = `
    <div class="modal" style="max-width:480px;">
      <button class="close-x" id="modal-close">×</button>
      <h2>📘 Panduan Penggunaan</h2>
      <p class="hint">Cara singkat menggunakan Database Staf.</p>
      <div style="font-size:13.5px; line-height:1.7; color:var(--ink);">
        <p><strong>Untuk semua orang:</strong> klik "Lihat Database" untuk melihat data staf, mencari, dan memfilter. Tidak perlu login.</p>
        <p><strong>Untuk super admin:</strong> klik "Login Admin", masukkan kata sandi, lalu Anda bisa menambah, mengedit, menghapus staf, mengunduh/mengunggah data lewat Excel.</p>
        <p><strong>Upload massal:</strong> unduh template Excel dari menu "Unduh Template", isi data staf di dalamnya, lalu upload lewat tombol "Upload Data Staf" setelah login sebagai admin.</p>
      </div>
      <div class="modal-actions">
        <button class="btn" id="guide-close">Mengerti</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('guide-close').addEventListener('click', closeModal);
  wrap.addEventListener('click', e => { if(e.target.id === 'overlay') closeModal(); });
}

function extractBulanTahun(tanggalSuratText, fallbackIsoDate){
  // Coba baca dari teks tanggal surat (format "27 Juli 2026")
  if(tanggalSuratText){
    const bulanPattern = BULAN_NAMES.join('|');
    const m = String(tanggalSuratText).match(new RegExp('(\\d{1,2})\\s+(' + bulanPattern + ')\\s+(\\d{4})', 'i'));
    if(m){
      const bulanIdx = BULAN_NAMES.findIndex(b => b.toLowerCase() === m[2].toLowerCase());
      if(bulanIdx !== -1) return { bulan: bulanIdx + 1, tahun: parseInt(m[3], 10) };
    }
    // Coba format ISO yyyy-MM-dd kalau ada
    const isoMatch = String(tanggalSuratText).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(isoMatch) return { bulan: parseInt(isoMatch[2], 10), tahun: parseInt(isoMatch[1], 10) };
  }
  // Kalau tidak terbaca, pakai tanggal upload sebagai cadangan
  if(fallbackIsoDate){
    const d = new Date(fallbackIsoDate);
    if(!isNaN(d.getTime())) return { bulan: d.getMonth() + 1, tahun: d.getFullYear() };
  }
  return null;
}

function formatTanggal(val){
  if(!val) return '';
  try{
    const datePart = String(val).split('T')[0]; // buang bagian waktu kalau ada (mis. dari ISO datetime lama)
    const d = new Date(datePart + 'T00:00:00');
    if(isNaN(d.getTime())) return val;
    return d.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
  }catch(e){ return val; }
}

function attachListeners(){
  const btnHome = document.getElementById('btn-home');
  if(btnHome) btnHome.addEventListener('click', () => { state.screen = 'landing'; render(); });

  const searchInput = document.getElementById('search-input');
  if(searchInput){
    searchInput.addEventListener('input', e => {
      const pos = e.target.selectionStart;
      state.search = e.target.value;
      render();
      restoreCursor('search-input', pos);
    });
  }
  const fStatus = document.getElementById('filter-status');
  if(fStatus) fStatus.addEventListener('change', e => { state.filterStatus = e.target.value; render(); });
  const fPend = document.getElementById('filter-pendidikan');
  if(fPend) fPend.addEventListener('change', e => { state.filterPendidikan = e.target.value; render(); });

  const totalCard = document.querySelector('[data-stat-total]');
  if(totalCard){
    totalCard.addEventListener('click', () => {
      state.filterStatus = '';
      state.filterPendidikan = '';
      state.filterProfesi = '';
      render();
      const tableCard = document.querySelector('.table-card');
      if(tableCard) tableCard.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  }

  document.querySelectorAll('[data-stat-status]').forEach(card => {
    card.addEventListener('click', () => {
      const val = card.getAttribute('data-stat-status');
      state.filterStatus = (state.filterStatus === val) ? '' : val;
      render();
      const tableCard = document.querySelector('.table-card');
      if(tableCard) tableCard.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  });

  document.querySelectorAll('[data-stat-profesi]').forEach(card => {
    card.addEventListener('click', () => {
      const val = card.getAttribute('data-stat-profesi');
      state.filterProfesi = (state.filterProfesi === val) ? '' : val;
      render();
      const tableCard = document.querySelector('.table-card');
      if(tableCard) tableCard.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  });

  const btnLogin = document.getElementById('btn-login');
  if(btnLogin) btnLogin.addEventListener('click', () => { state.modal = 'login'; state.loginError = ''; render(); });
  const btnLogout = document.getElementById('btn-logout');
  if(btnLogout) btnLogout.addEventListener('click', () => { state.isAdmin = false; render(); });
  const btnAdd = document.getElementById('btn-add');
  if(btnAdd) btnAdd.addEventListener('click', () => { state.editingId = null; state.modal = 'form'; render(); });
  const btnExport = document.getElementById('btn-export');
  if(btnExport) btnExport.addEventListener('click', exportToExcel);
  const btnTemplate = document.getElementById('btn-template');
  if(btnTemplate) btnTemplate.addEventListener('click', downloadTemplate);
  const btnImport = document.getElementById('btn-import');
  const importFile = document.getElementById('import-file');
  if(btnImport && importFile){
    btnImport.addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', handleImportFile);
  }

  document.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', () => { state.editingId = btn.getAttribute('data-edit'); state.modal = 'form'; render(); });
  });
  document.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', () => { state.deletingId = btn.getAttribute('data-delete'); state.modal = 'delete'; render(); });
  });
}

function restoreCursor(id, pos){
  const el = document.getElementById(id);
  if(el){
    el.focus();
    try{ el.setSelectionRange(pos, pos); }catch(e){}
  }
}

function renderLoginModal(){
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'overlay';
  wrap.innerHTML = `
    <div class="modal" style="max-width:380px;">
      <button class="close-x" id="modal-close">×</button>
      <div class="login-icon">🔑</div>
      <h2>Masuk sebagai Admin</h2>
      <p class="hint">Masukkan kata sandi super admin untuk dapat mengedit data.</p>
      <div class="field">
        <label>Kata sandi</label>
        <input type="password" id="login-pass" placeholder="••••••••">
      </div>
      ${state.loginError ? `<div class="error-text">${state.loginError}</div>` : ''}
      <div class="modal-actions">
        <button class="btn secondary" id="login-cancel">Batal</button>
        <button class="btn" id="login-submit">Masuk</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('login-cancel').addEventListener('click', closeModal);
  wrap.addEventListener('click', e => { if(e.target.id === 'overlay') closeModal(); });
  const passInput = document.getElementById('login-pass');
  passInput.focus();
  const submit = () => {
    if(passInput.value === ADMIN_PASSWORD){
      state.isAdmin = true;
      if(state.screen === 'landing') state.screen = 'dashboard';
      closeModal();
    } else {
      state.loginError = 'Kata sandi salah. Coba lagi.';
      state.modal = 'login';
      render();
    }
  };
  document.getElementById('login-submit').addEventListener('click', submit);
  passInput.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
}

function renderFormModal(){
  const editing = state.editingId ? state.staff.find(s => s.id === state.editingId) : null;
  const s = editing || { nama:'', nip:'', tempatLahir:'', tanggalLahir:'', email:'', jenisKelamin:'', pendidikan:'', profesi:'', statusPekerjaan:'', jabatanSK:'', jabatanRuangan:'', keterangan:'', nomorSTR:'', tglKadaluarsaSTR:'', linkDokumenSTR:'', fileIdSTR:'', nomorSIPA:'', tglKadaluarsaSIPA:'', linkDokumenSIPA:'', fileIdSIPA:'' };

  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'overlay';
  wrap.innerHTML = `
    <div class="modal">
      <button class="close-x" id="modal-close">×</button>
      <h2>${editing ? 'Edit Data Staf' : 'Tambah Staf Baru'}</h2>
      <p class="hint">${editing ? 'Perbarui data staf di bawah ini.' : 'Lengkapi data staf baru.'}</p>
      <form id="staff-form">
        <div class="field">
          <label>Nama staf</label>
          <input type="text" id="f-nama" value="${escapeHtml(s.nama)}" required>
        </div>
        <div class="field">
          <label>NIP <span class="opt-tag">(Opsional)</span></label>
          <input type="text" id="f-nip" value="${escapeHtml(s.nip)}">
        </div>
        <div class="grid2">
          <div class="field">
            <label>Tempat lahir <span class="opt-tag">(Opsional)</span></label>
            <input type="text" id="f-tempat" value="${escapeHtml(s.tempatLahir)}">
          </div>
          <div class="field">
            <label>Tanggal lahir <span class="opt-tag">(Opsional)</span></label>
            <input type="date" id="f-tanggal" value="${escapeHtml(dateOnly(s.tanggalLahir))}">
          </div>
        </div>
        <div class="grid2">
          <div class="field">
            <label>Email <span class="opt-tag">(Opsional)</span></label>
            <input type="email" id="f-email" value="${escapeHtml(s.email)}">
          </div>
          <div class="field">
            <label>Jenis kelamin <span class="opt-tag">(Opsional)</span></label>
            <select id="f-jk">
              <option value="">Pilih…</option>
              <option value="L" ${s.jenisKelamin==='L'?'selected':''}>Laki-laki</option>
              <option value="P" ${s.jenisKelamin==='P'?'selected':''}>Perempuan</option>
            </select>
          </div>
        </div>
        <div class="grid2">
          <div class="field">
            <label>Kualifikasi pendidikan <span class="opt-tag">(Opsional)</span></label>
            <select id="f-pendidikan">
              <option value="">Pilih…</option>
              ${PENDIDIKAN_OPTIONS.map(o => `<option value="${escapeHtml(o)}" ${s.pendidikan===o?'selected':''}>${o}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Profesi <span class="opt-tag">(Opsional)</span></label>
            <input type="text" id="f-profesi" placeholder="Contoh: Apoteker, TTK, Umum, Transporter, SKM, Adminkes" value="${escapeHtml(s.profesi)}">
          </div>
        </div>
        <div class="grid2">
          <div class="field">
            <label>Status pekerjaan <span class="opt-tag">(Opsional)</span></label>
            <select id="f-status">
              <option value="">Pilih…</option>
              ${STATUS_OPTIONS.map(o => `<option value="${escapeHtml(o)}" ${s.statusPekerjaan===o?'selected':''}>${o}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="grid2">
          <div class="field">
            <label>Jabatan sesuai SK <span class="opt-tag">(Opsional)</span></label>
            <input type="text" id="f-jabatan-sk" value="${escapeHtml(s.jabatanSK)}">
          </div>
          <div class="field">
            <label>Jabatan di ruangan <span class="opt-tag">(Opsional)</span></label>
            <input type="text" id="f-jabatan-ruangan" value="${escapeHtml(s.jabatanRuangan)}">
          </div>
        </div>
        <div class="field">
          <label>Keterangan (tambahan) <span class="opt-tag">(Opsional)</span></label>
          <textarea id="f-keterangan">${escapeHtml(s.keterangan)}</textarea>
        </div>

        <hr style="border:none; border-top:1px solid var(--line); margin:18px 0 16px;">
        <p class="hint" style="margin-bottom:14px; font-weight:600; color:var(--teal-2);">Legalitas Profesi <span class="opt-tag" style="font-weight:400;">(Opsional)</span></p>
        <div class="grid2">
          <div class="field">
            <label>Nomor STR <span class="opt-tag">(Opsional)</span></label>
            <input type="text" id="f-nomor-str" value="${escapeHtml(s.nomorSTR)}">
          </div>
          <div class="field">
            <label>Tanggal kadaluarsa STR <span class="opt-tag">(Opsional)</span></label>
            <input type="date" id="f-tgl-str" value="${escapeHtml(dateOnly(s.tglKadaluarsaSTR))}">
          </div>
        </div>
        <div class="field">
          <label>Scan STR <span class="opt-tag">(Opsional)</span></label>
          <div class="doc-box" id="docbox-str">
            <div id="doc-row-str"></div>
            <div class="sub" id="upload-str-status"></div>
            <button type="button" class="link-manual-toggle" id="toggle-manual-str">atau tempel link manual</button>
            <input type="url" id="f-link-str" placeholder="https://drive.google.com/…" value="${escapeHtml(s.linkDokumenSTR)}" style="display:none; margin-top:6px;">
          </div>
          <input type="file" id="file-upload-str" accept=".pdf,.jpg,.jpeg,.png" style="display:none;">
          <input type="hidden" id="f-fileid-str" value="${escapeHtml(s.fileIdSTR)}">
        </div>
        <div class="grid2">
          <div class="field">
            <label>Nomor SIPA <span class="opt-tag">(Opsional)</span></label>
            <input type="text" id="f-nomor-sipa" value="${escapeHtml(s.nomorSIPA)}">
          </div>
          <div class="field">
            <label>Tanggal kadaluarsa SIPA <span class="opt-tag">(Opsional)</span></label>
            <input type="date" id="f-tgl-sipa" value="${escapeHtml(dateOnly(s.tglKadaluarsaSIPA))}">
          </div>
        </div>
        <div class="field">
          <label>Scan SIPA <span class="opt-tag">(Opsional)</span></label>
          <div class="doc-box" id="docbox-sipa">
            <div id="doc-row-sipa"></div>
            <div class="sub" id="upload-sipa-status"></div>
            <button type="button" class="link-manual-toggle" id="toggle-manual-sipa">atau tempel link manual</button>
            <input type="url" id="f-link-sipa" placeholder="https://drive.google.com/…" value="${escapeHtml(s.linkDokumenSIPA)}" style="display:none; margin-top:6px;">
          </div>
          <input type="file" id="file-upload-sipa" accept=".pdf,.jpg,.jpeg,.png" style="display:none;">
          <input type="hidden" id="f-fileid-sipa" value="${escapeHtml(s.fileIdSIPA)}">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="form-cancel">Batal</button>
          <button type="submit" class="btn">${editing ? 'Simpan Perubahan' : 'Tambah Staf'}</button>
        </div>
      </form>
    </div>
  `;
  document.body.appendChild(wrap);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('form-cancel').addEventListener('click', closeModal);
  wrap.addEventListener('click', e => { if(e.target.id === 'overlay') closeModal(); });
  document.getElementById('f-nama').focus();

  function wireDocUpload(rowId, fileInputId, linkInputId, fileIdInputId, statusId, toggleId, docType, label){
    const fileInput = document.getElementById(fileInputId);
    const linkInput = document.getElementById(linkInputId);
    const fileIdInput = document.getElementById(fileIdInputId);
    const toggleBtn = document.getElementById(toggleId);
    const statusEl = document.getElementById(statusId);
    if(!fileInput || !linkInput) return;

    function renderRow(){
      const row = document.getElementById(rowId);
      const hasLink = !!linkInput.value;
      row.innerHTML = hasLink ? `
        <span class="doc-chip">📄 File tersimpan</span>
        <button type="button" class="btn secondary small" data-act="view">Lihat File</button>
        <button type="button" class="btn secondary small" data-act="replace">Ganti File</button>
      ` : `
        <button type="button" class="btn secondary small" data-act="upload">⬆ ${label}</button>
      `;
      const viewBtn = row.querySelector('[data-act="view"]');
      const replaceBtn = row.querySelector('[data-act="replace"]');
      const uploadBtn = row.querySelector('[data-act="upload"]');
      if(viewBtn) viewBtn.addEventListener('click', () => openFilePreviewModal(fileIdInput.value || linkInput.value, linkInput.value));
      if(replaceBtn) replaceBtn.addEventListener('click', () => fileInput.click());
      if(uploadBtn) uploadBtn.addEventListener('click', () => fileInput.click());
    }

    if(toggleBtn){
      toggleBtn.addEventListener('click', () => {
        linkInput.style.display = linkInput.style.display === 'none' ? 'block' : 'none';
      });
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if(!file) return;
      if(!SHEETS_API_URL){
        alert('Upload otomatis ke Google Drive belum aktif (SHEETS_API_URL belum diisi). Silakan tempel link Google Drive secara manual lewat "atau tempel link manual".');
        return;
      }
      if(file.size > SURAT_MAX_SIZE_BYTES){
        alert(`Ukuran file (${(file.size / (1024*1024)).toFixed(1)} MB) melebihi batas maksimal 10 MB.`);
        return;
      }
      if(statusEl) statusEl.textContent = 'Mengunggah ke Google Drive…';
      try{
        const base64 = await fileToBase64(file);
        const result = await uploadFileToDrive(base64, file.name, docType, file.type || 'application/octet-stream');
        if(result.url){
          linkInput.value = result.url;
          fileIdInput.value = result.fileId || '';
          if(statusEl) statusEl.textContent = '✓ Berhasil diupload.';
          renderRow();
        } else {
          if(statusEl) statusEl.textContent = '';
          alert(`Gagal mengunggah file ke Google Drive.\n\nPenyebab: ${result.error || 'tidak diketahui'}\n\nCoba lagi, atau tempel link manual lewat "atau tempel link manual".`);
        }
      }catch(err){
        console.error(err);
        if(statusEl) statusEl.textContent = '';
        alert('Gagal mengunggah file.');
      }
    });

    renderRow();
  }
  wireDocUpload('doc-row-str', 'file-upload-str', 'f-link-str', 'f-fileid-str', 'upload-str-status', 'toggle-manual-str', 'str', 'Upload Scan STR');
  wireDocUpload('doc-row-sipa', 'file-upload-sipa', 'f-link-sipa', 'f-fileid-sipa', 'upload-sipa-status', 'toggle-manual-sipa', 'sipa', 'Upload Scan SIPA');

  document.getElementById('staff-form').addEventListener('submit', async e => {
    e.preventDefault();
    const data = {
      nama: document.getElementById('f-nama').value.trim(),
      nip: document.getElementById('f-nip').value.trim(),
      tempatLahir: document.getElementById('f-tempat').value.trim(),
      tanggalLahir: document.getElementById('f-tanggal').value,
      email: document.getElementById('f-email').value.trim(),
      jenisKelamin: document.getElementById('f-jk').value,
      pendidikan: document.getElementById('f-pendidikan').value,
      profesi: document.getElementById('f-profesi').value.trim(),
      statusPekerjaan: document.getElementById('f-status').value,
      jabatanSK: document.getElementById('f-jabatan-sk').value.trim(),
      jabatanRuangan: document.getElementById('f-jabatan-ruangan').value.trim(),
      keterangan: document.getElementById('f-keterangan').value.trim(),
      nomorSTR: document.getElementById('f-nomor-str').value.trim(),
      tglKadaluarsaSTR: document.getElementById('f-tgl-str').value,
      linkDokumenSTR: document.getElementById('f-link-str').value.trim(),
      fileIdSTR: document.getElementById('f-fileid-str').value.trim(),
      nomorSIPA: document.getElementById('f-nomor-sipa').value.trim(),
      tglKadaluarsaSIPA: document.getElementById('f-tgl-sipa').value,
      linkDokumenSIPA: document.getElementById('f-link-sipa').value.trim(),
      fileIdSIPA: document.getElementById('f-fileid-sipa').value.trim()
    };
    if(!data.nama){ alert('Nama staf wajib diisi.'); return; }

    if(editing){
      const idx = state.staff.findIndex(x => x.id === editing.id);
      state.staff[idx] = { ...editing, ...data };
    } else {
      state.staff.push({ id: uid(), ...data });
    }
    closeModal();
    await saveData();
    render();
  });
}

function renderDeleteModal(){
  const s = state.staff.find(x => x.id === state.deletingId);
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'overlay';
  wrap.innerHTML = `
    <div class="modal" style="max-width:400px;">
      <button class="close-x" id="modal-close">×</button>
      <h2>Hapus data staf?</h2>
      <p class="hint">Data <strong>${escapeHtml(s ? s.nama : '')}</strong> akan dihapus permanen dari database ini.</p>
      <div class="modal-actions">
        <button class="btn secondary" id="delete-cancel">Batal</button>
        <button class="btn danger" id="delete-confirm" style="background:var(--danger); color:#fff; border-color:var(--danger);">Ya, Hapus</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('delete-cancel').addEventListener('click', closeModal);
  wrap.addEventListener('click', e => { if(e.target.id === 'overlay') closeModal(); });
  document.getElementById('delete-confirm').addEventListener('click', async () => {
    state.staff = state.staff.filter(x => x.id !== state.deletingId);
    closeModal();
    await saveData();
    render();
  });
}

function closeModal(){
  const overlay = document.getElementById('overlay');
  if(overlay) overlay.remove();
  state.modal = null;
  state.editingId = null;
  state.deletingId = null;
  render();
}

loadData();
</script>
</body>
</html>
