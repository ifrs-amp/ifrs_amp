<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Database Staf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F4F3; --paper:#FFFFFF; --ink:#16302E; --ink-soft:#4B615F;
    --teal:#123F3E; --teal-2:#1E5B58; --amber:#B8863B; --amber-soft:#F1E4CB;
    --line:#DCE3E1; --danger:#A8453A; --danger-soft:#F5E1DE;
    --ok:#3F7A5C; --ok-soft:#E1EEE5; --radius:10px;
    --shadow:0 1px 2px rgba(18,63,62,.06),0 6px 20px rgba(18,63,62,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;transition:background .4s ease;}
  body.landing-bg{background:linear-gradient(135deg,#EAF3FC 0%,#DCEAFA 50%,#E7F1FC 100%);background-size:200% 200%;animation:bgShift 16s ease-in-out infinite;overflow-x:hidden;position:relative;}
  @keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .bg-blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0;pointer-events:none;}
  .bg-blob-1{width:420px;height:420px;background:#BFE0FA;top:-140px;left:-120px;animation:floatBlob1 20s ease-in-out infinite;}
  .bg-blob-2{width:360px;height:360px;background:#CFE4FB;bottom:-120px;right:-100px;animation:floatBlob2 24s ease-in-out infinite;}
  .bg-blob-3{width:280px;height:280px;background:#D9EBFC;top:40%;left:50%;animation:floatBlob3 28s ease-in-out infinite;}
  @keyframes floatBlob1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,50px) scale(1.08)}}
  @keyframes floatBlob2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,-40px) scale(1.05)}}
  @keyframes floatBlob3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) translate(40px,-60px) scale(1.1)}}
  ::selection{background:var(--amber-soft);}
  .wrap{max-width:min(1680px,97vw);margin:0 auto;padding:28px 24px 80px;}

  .home-link{background:none;border:none;color:var(--ink-soft);font-size:12px;font-weight:600;padding:0 0 8px;cursor:pointer;letter-spacing:.02em;}
  .home-link:hover{color:var(--teal-2);}

  .landing-wrap{max-width:1180px;margin:0 auto;padding:40px 20px 60px;position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;justify-content:center;}
  .orbit-label{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 40px;font-weight:600;}
  .orbit-grid{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;align-items:center;justify-items:center;gap:36px;max-width:760px;margin:0 auto;}
  .orbit-circle-btn{width:190px;height:190px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(160deg,var(--teal) 0%,var(--teal-2) 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:'Inter',sans-serif;font-weight:700;font-size:17px;text-align:center;padding:16px;box-shadow:0 16px 40px rgba(18,63,62,.30);transition:transform .18s ease,box-shadow .18s ease;}
  .orbit-circle-btn:hover{transform:translateY(-5px) scale(1.05);box-shadow:0 22px 50px rgba(18,63,62,.38);}
  .orbit-circle-btn svg{width:52px;height:52px;}
  .orbit-center{grid-column:2;grid-row:2;}
  .orbit-top-popup{grid-column:2;grid-row:1;display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(14px) scale(.9);pointer-events:none;transition:opacity .25s ease,transform .25s ease;}
  .orbit-top-popup.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .orbit-top-popup .orbit-circle-btn{width:160px;height:160px;font-size:15.5px;background:linear-gradient(160deg,var(--amber) 0%,#9C6B26 100%);color:#fff;}
  .orbit-right-popup{grid-column:3;grid-row:2;display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateX(14px) scale(.9);pointer-events:none;transition:opacity .25s ease,transform .25s ease;}
  .orbit-right-popup.open{opacity:1;transform:translateX(0) scale(1);pointer-events:auto;}
  .orbit-right-popup .orbit-circle-btn{width:160px;height:160px;font-size:15px;background:linear-gradient(160deg,#3F7A5C 0%,#2A5A40 100%);color:#fff;}
  .orbit-left-popup{grid-column:1;grid-row:2;display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateX(-14px) scale(.9);pointer-events:none;transition:opacity .25s ease,transform .25s ease;}
  .orbit-left-popup.open{opacity:1;transform:translateX(0) scale(1);pointer-events:auto;}
  .orbit-left-popup .orbit-circle-btn{width:160px;height:160px;font-size:15px;background:linear-gradient(160deg,#2E5490 0%,#1D3A66 100%);color:#fff;}
  .orbit-slot-bottom{grid-column:1/span 3;grid-row:3;min-height:20px;}
  @media (max-width:720px){
    .orbit-grid{gap:20px;max-width:100%;}
    .orbit-circle-btn{width:130px;height:130px;font-size:14px;padding:12px;gap:8px;}
    .orbit-circle-btn svg{width:36px;height:36px;}
    .orbit-top-popup .orbit-circle-btn,.orbit-right-popup .orbit-circle-btn,.orbit-left-popup .orbit-circle-btn{width:110px;height:110px;font-size:12.5px;}
  }

  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:20px;margin-bottom:24px;border-bottom:1px solid var(--line);}
  .brand-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-2);margin:0 0 6px;}
  .brand-title{font-family:'Fraunces',serif;font-weight:600;font-size:32px;margin:0;color:var(--teal);letter-spacing:-.01em;}
  .brand-sub{margin:6px 0 0;color:var(--ink-soft);font-size:14px;}
  .admin-zone{display:flex;align-items:center;gap:10px;}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);display:flex;align-items:center;gap:6px;background:var(--paper);}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:#B7BFBD;}
  .pill.on .dot{background:var(--ok);}
  .pill.on{color:var(--ok);border-color:var(--ok-soft);background:var(--ok-soft);}

  button{font-family:'Inter',sans-serif;cursor:pointer;}
  .btn{border:1px solid var(--teal);background:var(--teal);color:#fff;padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:600;transition:transform .12s ease,background .15s ease;}
  .btn:hover{background:var(--teal-2);}
  .btn:active{transform:scale(.97);}
  .btn.secondary{background:transparent;color:var(--teal);}
  .btn.secondary:hover{background:#E7EEEC;}
  .btn.danger{background:transparent;border-color:var(--danger-soft);color:var(--danger);}
  .btn.danger:hover{background:var(--danger-soft);}
  .btn.small{padding:6px 11px;font-size:12.5px;border-radius:7px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px;}
  .section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px;}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  .reminder-card{background:var(--paper);border:1px solid var(--danger-soft);border-left:4px solid var(--danger);border-radius:var(--radius);padding:16px 18px;margin-bottom:22px;box-shadow:var(--shadow);}
  .reminder-card.warn{border-left-color:var(--amber);border-color:var(--amber-soft);}
  .reminder-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .reminder-title{font-family:'Fraunces',serif;font-weight:600;font-size:15.5px;color:var(--danger);display:flex;align-items:center;gap:8px;margin:0;}
  .reminder-title.warn{color:#8A5F1E;}
  .reminder-sub{font-size:12px;color:var(--ink-soft);margin:0 0 12px;}
  .reminder-list{display:flex;flex-direction:column;gap:6px;}
  .reminder-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:7px;background:#FAF7F3;font-size:13px;}
  .reminder-item .who{font-weight:600;color:var(--ink);}
  .reminder-item .doc{color:var(--ink-soft);font-size:12px;}
  .reminder-status{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 8px;border-radius:6px;white-space:nowrap;font-weight:600;}
  .reminder-status.expired{background:var(--danger-soft);color:var(--danger);}
  .reminder-status.soon{background:var(--amber-soft);color:#8A5F1E;}
  .stat.clickable{cursor:pointer;transition:transform .12s ease,border-color .15s ease,box-shadow .15s ease;}
  .stat.clickable:hover{border-color:var(--teal-2);transform:translateY(-2px);}
  .stat.active{border-color:var(--teal);background:#EFF6F4;box-shadow:0 0 0 2px rgba(18,63,62,.12);}
  .stat .num{font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:var(--teal);line-height:1;}
  .stat .label{font-size:12px;color:var(--ink-soft);margin-top:6px;}

  .toolbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    position:sticky;top:0;z-index:60;
    background:rgba(241,244,243,0.96);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    padding:14px 20px;
    margin:0 -20px 18px;
    border-bottom:1px solid var(--line);
    box-shadow:0 6px 14px -8px rgba(18,63,62,0.18);
    transition:box-shadow .2s ease;
  }
  .search{flex:1;min-width:200px;position:relative;}
  .search input{width:100%;padding:10px 12px 10px 34px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:13.5px;color:var(--ink);}
  .search input:focus{outline:none;border-color:var(--teal-2);}
  .search::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:16px;}
  select.filter{padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:13px;color:var(--ink-soft);max-width:170px;}
  select.filter:focus{outline:none;border-color:var(--teal-2);}

  .table-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto;overflow-y:hidden;}
  table{width:100%;min-width:960px;border-collapse:collapse;font-size:12.8px;table-layout:auto;}
  thead th{text-align:left;padding:10px 10px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--line);background:#F8FAF9;font-weight:600;white-space:normal;}
  tbody td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFBFA;}
  .nama-cell{font-family:'Fraunces',serif;font-weight:600;color:var(--teal);font-size:14.5px;}
  .sub{color:var(--ink-soft);font-size:12px;margin-top:2px;}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .badge.pns{background:#E1EEE5;color:#2F6248;}
  .badge.pppk{background:#EAF0F8;color:#2E5490;}
  .badge.pppkp{background:#EDE7F5;color:#5A3E8C;}
  .badge.blud{background:var(--amber-soft);color:#8A5F1E;}
  .badge.pt{background:#F3ECE6;color:#7A5133;}
  .badge.aktif{background:var(--ok-soft);color:var(--ok);}
  .badge.tidak-aktif{background:var(--danger-soft);color:var(--danger);}
  .badge.cuti-tahunan{background:#EAF0F8;color:#2E5490;}
  .badge.cuti-sakit{background:var(--danger-soft);color:var(--danger);}
  .badge.cuti-melahirkan{background:#EDE7F5;color:#5A3E8C;}
  .badge.cuti-menikah{background:var(--amber-soft);color:#8A5F1E;}
  .badge.surat-tunda{background:var(--amber-soft);color:#8A5F1E;}
  .badge.surat-revisi{background:#EAF0F8;color:#2E5490;}
  .badge.disetujui-kepala{background:#EAF0F8;color:#2E5490;}
  .badge.disetujui-koordinator{background:var(--amber-soft);color:#8A5F1E;}

  .surat-list{display:flex;flex-direction:column;gap:14px;}
  .surat-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .surat-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:14px 18px;background:linear-gradient(180deg,#F8FAF9 0%,#F3F7F6 100%);border-bottom:1px solid var(--line);}
  .surat-card-header .surat-title{flex:1;min-width:0;}
  .surat-tanggal{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-2);margin:0 0 4px;}
  .surat-hal{font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--teal);margin:0 0 4px;line-height:1.35;word-break:break-word;}
  .surat-nomor{font-size:12.5px;color:var(--ink-soft);}
  .surat-nomor strong{color:var(--ink);font-weight:600;}
  .surat-actions{display:flex;gap:6px;flex-shrink:0;}
  .surat-card-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 18px;padding:16px 18px;}
  .surat-field{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .surat-field > label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
  .surat-field .field-body{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .surat-field .field-body select.filter{max-width:100%;width:100%;font-size:12.5px;}
  .surat-field .field-body input[type="text"]{width:100%;padding:7px 10px;border-radius:7px;border:1px solid var(--line);font-size:12.5px;}
  .surat-field .field-file-name{font-size:11.5px;color:var(--ink-soft);margin-top:3px;word-break:break-all;}

  .pagination{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:20px;padding:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .pagination button{border:1px solid var(--line);background:var(--paper);color:var(--teal);padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s ease;}
  .pagination button:hover:not([disabled]){background:#EFF6F4;}
  .pagination button[disabled]{opacity:.35;cursor:not-allowed;}
  .pagination .page-info{font-size:13px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .pagination .page-info strong{color:var(--teal);}

  .month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:22px;}
  .month-nav button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:16px;color:var(--teal);cursor:pointer;}
  .month-nav button:hover{background:#EFF6F4;}
  .month-nav .month-label{font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:var(--teal);min-width:180px;text-align:center;}
  .cuti-table-wrap{width:100%;}
  table.cuti-table{border-collapse:collapse;font-size:11.5px;table-layout:fixed;width:100%;min-width:1580px;}
  table.cuti-table th,table.cuti-table td{border:1px solid var(--line);padding:4px 1px;text-align:center;overflow:hidden;text-overflow:ellipsis;}
  table.cuti-table thead th{background:#F8FAF9;color:var(--ink-soft);font-weight:600;font-size:9.5px;text-transform:uppercase;}
  table.cuti-table td.nama-col,table.cuti-table th.nama-col{text-align:left;white-space:normal;width:140px;padding-left:6px;}
  table.cuti-table td.ruangan-col,table.cuti-table th.ruangan-col{text-align:left;white-space:normal;width:128px;padding-left:6px;}
  table.cuti-table td.disetujui-col,table.cuti-table th.disetujui-col{text-align:left;white-space:normal;width:168px;padding-left:6px;}
  table.cuti-table td.day-cell{width:26px;color:var(--ink-soft);font-size:10.5px;overflow:visible;text-overflow:clip;padding:4px 0;}
  table.cuti-table th.day-header{overflow:visible;text-overflow:clip;padding:4px 0;font-size:10px;white-space:nowrap;width:26px;}
  table.cuti-table td.day-cell.taken{background:var(--danger);color:#fff;font-weight:700;border-color:var(--danger);}
  table.cuti-table td.day-cell.taken-excluded{background:#E4E8E7;color:#8A9694;font-weight:600;}
  table.cuti-table td.day-cell-sunday{background:#FBE1DE;}
  table.cuti-table td.day-cell-holiday{background:#FADCEC;}
  table.cuti-table th.day-header-sunday{background:var(--danger);color:#fff;}
  table.cuti-table th.day-header-holiday{background:#D6488F;color:#fff;}
  table.cuti-table td.total-col,table.cuti-table th.total-col{font-weight:700;color:var(--teal);background:#F3F8F7;width:60px;}
  table.cuti-table td.no-col,table.cuti-table th.no-col{width:34px;color:var(--ink-soft);}
  table.cuti-table td.aksi-col,table.cuti-table th.aksi-col{white-space:nowrap;width:104px;overflow:visible;}
  table.cuti-table td.aksi-col .row-actions{display:flex;flex-direction:column;gap:4px;}
  table.cuti-table td.aksi-col .btn.small{padding:3px 5px;font-size:10px;width:100%;}
  table.cuti-table td.ruangan-col .badge,table.cuti-table td.disetujui-col .badge{white-space:normal;line-height:1.3;text-align:center;border-radius:10px;}
  .row-actions{display:flex;gap:6px;}
  .empty-row td{padding:44px 14px;text-align:center;color:var(--ink-soft);}
  .empty-row .big{font-family:'Fraunces',serif;font-size:17px;color:var(--teal);margin-bottom:4px;}

  /* === PERBAIKAN: z-index overlay dinaikkan agar di atas toolbar sticky === */
  .overlay{position:fixed;inset:0;background:rgba(18,45,44,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--paper);width:100%;max-width:560px;border-radius:14px;padding:26px 28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto;position:relative;}
  .modal h2{font-family:'Fraunces',serif;font-size:22px;margin:0 0 4px;color:var(--teal);}
  .modal p.hint{margin:0 0 18px;color:var(--ink-soft);font-size:13px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.02em;}
  .opt-tag{font-weight:400;font-style:italic;color:#9AA8A6;text-transform:none;letter-spacing:0;}
  .doc-box{background:#FAFBFA;border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  .doc-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .doc-chip{font-size:12.5px;color:var(--ok);font-weight:600;display:flex;align-items:center;gap:4px;}
  .link-manual-toggle{background:none;border:none;color:var(--ink-soft);font-size:11.5px;text-decoration:underline;cursor:pointer;padding:6px 0 0;display:block;}
  .link-manual-toggle:hover{color:var(--teal-2);}
  .preview-modal{max-width:820px;width:95vw;padding:16px 16px 20px;}
  .preview-modal iframe{width:100%;height:70vh;border:none;border-radius:8px;background:#f2f2f2;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);font-size:13.5px;font-family:'Inter',sans-serif;color:var(--ink);background:#FCFDFD;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal-2);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
  .close-x{position:absolute;top:16px;right:18px;background:none;border:none;font-size:20px;color:var(--ink-soft);}
  textarea{resize:vertical;min-height:60px;}

  .login-icon{width:40px;height:40px;border-radius:10px;background:var(--amber-soft);display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px;color:#8A5F1E;}
  .error-text{color:var(--danger);font-size:12.5px;margin-top:8px;}
  .footnote{text-align:center;color:var(--ink-soft);font-size:11.5px;margin-top:28px;line-height:1.6;}
  @media (max-width:720px){
    .grid2{grid-template-columns:1fr;}
    table{font-size:12.5px;}
    thead th,tbody td{padding:9px 10px;}
    .topbar{flex-direction:column;align-items:flex-start;}
    .surat-card-header{flex-direction:column;}
    .surat-card-body{grid-template-columns:1fr;}
    .pagination{flex-wrap:wrap;gap:8px;}
    .toolbar{margin:0 -16px 16px;padding:12px 16px;}
  }
</style>

function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); }
function parseDateLocal(dateStr){
  if(!dateStr) return null;
  const datePart = String(dateStr).split('T')[0];
  const d = new Date(datePart + 'T00:00:00');
  return isNaN(d.getTime()) ? null : d;
}
function dateOnly(val){ return val ? String(val).split('T')[0] : ''; }
function formatDateISO(d){
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function countDaysInclusive(startStr, endStr){
  const start = parseDateLocal(startStr), end = parseDateLocal(endStr);
  if(!start || !end) return 0;
  const diff = Math.round((end - start) / 86400000) + 1;
  return diff > 0 ? diff : 0;
}
function isCountedDay(dateObj, shift, holidayList){
  if(shift === 'Cuti Melahirkan') return true;
  const dow = dateObj.getDay();
  const dateStr = formatDateISO(dateObj);
  if(holidayList.includes(dateStr)) return false;
  if(shift === 'Non Shift') return dow >= 1 && dow <= 5;
  if(shift === 'Shift') return dow >= 1 && dow <= 6;
  return true;
}
function isCountedDayForEntry(dateObj, entry, holidayList){
  if(entry.keterangan === 'Cuti Melahirkan') return true;
  return isCountedDay(dateObj, entry.shift, holidayList);
}
function countCutiDays(entry, holidayList){
  const start = parseDateLocal(entry.tglMulai), end = parseDateLocal(entry.tglSelesai);
  if(!start || !end) return 0;
  if(entry.keterangan !== 'Cuti Melahirkan' && !entry.shift) return countDaysInclusive(entry.tglMulai, entry.tglSelesai);
  let count = 0;
  const cursor = new Date(start);
  while(cursor <= end){
    if(isCountedDayForEntry(cursor, entry, holidayList)) count++;
    cursor.setDate(cursor.getDate() + 1);
  }
  return count;
}
function getDayNumbersForEntry(entry, year, month){
  const start = parseDateLocal(entry.tglMulai), end = parseDateLocal(entry.tglSelesai);
  if(!start || !end) return [];
  const days = [];
  const cursor = new Date(start);
  while(cursor <= end){
    if(cursor.getFullYear() === year && (cursor.getMonth() + 1) === month){
      const counted = (entry.keterangan === 'Cuti Melahirkan' || entry.shift) ? isCountedDayForEntry(cursor, entry, state.liburNasional) : true;
      days.push({ day: cursor.getDate(), counted });
    }
    cursor.setDate(cursor.getDate() + 1);
  }
  return days;
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function buildTextWithLines(content){
  const items = content.items;
  const lines = [];
  let currentY = null, currentLine = [];
  items.forEach(item => {
    const y = item.transform[5];
    if(currentY === null || Math.abs(y - currentY) > 2){
      if(currentLine.length) lines.push(currentLine.join(' '));
      currentLine = [item.str]; currentY = y;
    } else { currentLine.push(item.str); }
  });
  if(currentLine.length) lines.push(currentLine.join(' '));
  return lines.join('\n');
}
async function extractPdfFirstPageText(arrayBuffer){
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const page = await pdf.getPage(1);
  const content = await page.getTextContent();
  return buildTextWithLines(content);
}
async function ocrPdfFirstPage(arrayBuffer, onProgress){
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 2.2 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
  const result = await Tesseract.recognize(canvas, 'ind+eng', {
    logger: m => { if(onProgress && m.status === 'recognizing text') onProgress(Math.round((m.progress || 0) * 100)); }
  });
  return result.data.text;
}
function extractSuratFields(text){
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  function findLabelValueStrict(labelRegex){
    for(const line of lines){
      const m = line.match(labelRegex);
      if(m && m[1] && m[1].trim()) return m[1].trim();
    }
    return '';
  }
  function findLabelOnNextLine(exactLabelRegex){
    for(let i = 0; i < lines.length; i++){
      if(exactLabelRegex.test(lines[i]) && lines[i + 1]) return lines[i + 1].trim();
    }
    return '';
  }
  const nomorSurat = findLabelValueStrict(/^Nomor\s*[:\-]\s*(.+)$/i) || findLabelValueStrict(/^No\.?\s*[:\-]\s*(.+)$/i) || findLabelOnNextLine(/^Nomor$/i) || findLabelOnNextLine(/^No\.?$/i);
  const hal = findLabelValueStrict(/^Hal\s*[:\-]\s*(.+)$/i) || findLabelValueStrict(/^Perihal\s*[:\-]\s*(.+)$/i) || findLabelOnNextLine(/^Hal$/i) || findLabelOnNextLine(/^Perihal$/i);
  const bulan = '(Januari|Februari|Maret|April|Mei|Juni|Juli|Agustus|September|Oktober|November|Desember)';
  const bulanRe = new RegExp('(\\d{1,2})\\s+' + bulan + '\\s+(\\d{4})', 'i');
  let tanggalSurat = '';
  for(const line of lines){
    const m = line.match(bulanRe);
    if(m){ tanggalSurat = `${m[1]} ${m[2]} ${m[3]}`; break; }
  }
  return { nomorSurat, hal, tanggalSurat };
}
function base64ToBlobUrl(base64, mime){
  const byteChars = atob(base64);
  const byteNumbers = new Array(byteChars.length);
  for(let i = 0; i < byteChars.length; i++){ byteNumbers[i] = byteChars.charCodeAt(i); }
  return URL.createObjectURL(new Blob([new Uint8Array(byteNumbers)], { type: mime || 'application/pdf' }));
}
const SURAT_MAX_SIZE_BYTES = 10 * 1024 * 1024;
const SURAT_CHUNK_SIZE = 1 * 1024 * 1024;
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
async function storageSetWithRetry(key, value, attempts = 3){
  for(let a = 1; a <= attempts; a++){
    try{ if(await window.storage.set(key, value, true)) return true; }
    catch(e){ console.error(`storage.set gagal (percobaan ${a})`, key, e); }
    if(a < attempts) await sleep(400 * a);
  }
  return false;
}
async function storageGetWithRetry(key, attempts = 3){
  for(let a = 1; a <= attempts; a++){
    try{ const r = await window.storage.get(key, true); if(r && r.value) return r.value; }
    catch(e){ console.error(`storage.get gagal (percobaan ${a})`, key, e); }
    if(a < attempts) await sleep(400 * a);
  }
  return null;
}
async function saveFileChunked(id, base64){
  const chunks = [];
  for(let i = 0; i < base64.length; i += SURAT_CHUNK_SIZE) chunks.push(base64.slice(i, i + SURAT_CHUNK_SIZE));
  for(let i = 0; i < chunks.length; i++){
    const ok = await storageSetWithRetry(`surat-file:${id}:${i}`, chunks[i]);
    if(!ok) throw new Error(`Gagal menyimpan bagian file ke-${i + 1} dari ${chunks.length}`);
  }
  const verify = await loadFileChunked(id, chunks.length);
  if(verify.length !== base64.length) throw new Error('Verifikasi file gagal');
  return chunks.length;
}
async function loadFileChunked(id, chunkCount){
  let combined = '';
  for(let i = 0; i < chunkCount; i++){
    const v = await storageGetWithRetry(`surat-file:${id}:${i}`);
    if(!v) throw new Error('Bagian file tidak lengkap (bagian ke-' + (i + 1) + ' hilang)');
    combined += v;
  }
  return combined;
}
function waitForLib(checkFn, timeoutMs){
  return new Promise(resolve => {
    const start = Date.now();
    const interval = setInterval(() => {
      if(checkFn()){ clearInterval(interval); resolve(true); }
      else if(Date.now() - start > timeoutMs){ clearInterval(interval); resolve(false); }
    }, 250);
  });
}

async function handleSuratFileSelected(file){
  if(!file) return;
  if(file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')){ alert('File harus berformat PDF.'); return; }
  if(file.size > SURAT_MAX_SIZE_BYTES){ alert(`Ukuran file (${(file.size / (1024*1024)).toFixed(1)} MB) melebihi batas 10 MB.`); return; }
  state.suratUploading = true;
  state.suratUploadStatus = 'Menyiapkan pembaca PDF…';
  render();

  let pdfReady = typeof pdfjsLib !== 'undefined';
  if(!pdfReady) pdfReady = await waitForLib(() => typeof pdfjsLib !== 'undefined', 6000);

  let fields = { nomorSurat:'', hal:'', tanggalSurat:'' };
  let usedOcr = false, skippedExtraction = false;

  if(pdfReady){
    state.suratUploadStatus = 'Membaca teks PDF…'; render();
    try{
      const ab = await file.arrayBuffer();
      fields = extractSuratFields(await extractPdfFirstPageText(ab));
    }catch(err){ console.error('Gagal membaca isi PDF', err); }
  } else { skippedExtraction = true; }

  const foundNothing = !fields.tanggalSurat && !fields.hal && !fields.nomorSurat;
  if(pdfReady && foundNothing && typeof Tesseract !== 'undefined'){
    usedOcr = true;
    try{
      state.suratUploadStatus = 'OCR… 0%'; render();
      const ab2 = await file.arrayBuffer();
      const ocrText = await ocrPdfFirstPage(ab2, pct => { state.suratUploadStatus = `OCR… ${pct}%`; render(); });
      fields = extractSuratFields(ocrText);
    }catch(err){ console.error('Gagal OCR PDF', err); }
  }

  state.suratUploadStatus = 'Menyimpan file…'; render();
  let base64 = null;
  try{ base64 = await fileToBase64(file); }catch(err){ console.error('Gagal membaca file', err); }

  const entry = {
    id: uid(),
    tanggalSurat: fields.tanggalSurat,
    hal: fields.hal,
    nomorSurat: fields.nomorSurat,
    fileName: file.name,
    uploadedAt: new Date().toISOString()
  };

  if(base64 && SHEETS_API_URL){
    state.suratUploadStatus = 'Mengunggah ke Google Drive…'; render();
    const r = await uploadFileToDrive(base64, file.name, 'surat', 'application/pdf');
    if(r.url){ entry.linkGoogleDrive = r.url; entry.fileId = r.fileId; }
    else alert(`Gagal mengunggah ke Drive.\n\nPenyebab: ${r.error || 'tidak diketahui'}`);
  } else if(base64){
    try{ entry.fileChunks = await saveFileChunked(entry.id, base64); }
    catch(e){ console.error('Gagal menyimpan file PDF', e); alert('Data surat tersimpan, tetapi file PDF gagal disimpan.'); }
  }

  state.suratList.push(entry);
  await saveSuratList();
  state.suratUploading = false;
  state.suratUploadStatus = '';
  state.suratPage = 1;
  render();

  if(skippedExtraction){
    alert('Surat berhasil diupload. Modul pembaca PDF tidak dimuat; Tanggal/Hal/Nomor isi manual lewat "Edit".');
  } else if(!fields.tanggalSurat && !fields.hal && !fields.nomorSurat){
    alert(`Surat berhasil diupload${usedOcr ? ' (dengan OCR)' : ''}, tapi Tanggal/Hal/Nomor tidak terdeteksi otomatis. Silakan klik "Edit".`);
  }
}

async function viewSuratFile(id){
  try{

}

function escapeHtml(str){

  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function formatTanggal(val){
  if(!val) return '';

function docStatus(expiryDate){
  if(!expiryDate) return null;
  if(expiryDate === 'SEUMUR_HIDUP') return 'aktif';
  const d = daysUntil(expiryDate);
  if(d === null) return null;
  return d < 0 ? 'tidak-aktif' : 'aktif';
}
function renderDocCell(nomor, expiryDate){
  if(!nomor && !expiryDate) return '<span class="sub">—</span>';
  const isSeumurHidup = expiryDate === 'SEUMUR_HIDUP';
  const status = docStatus(expiryDate);
  const badge = status === 'aktif' ? '<span class="badge aktif">Aktif</span>' : status === 'tidak-aktif' ? '<span class="badge tidak-aktif">Tidak Aktif</span>' : '';

function normalizeJenisKelamin(raw){
  const v = (raw || '').toString().trim().toLowerCase();
  if(['l','laki-laki','laki laki','pria','male','m'].includes(v)) return 'L';
  if(['p','perempuan','wanita','female','f'].includes(v)) return 'P';
  return '';
}
function normalizePendidikan(raw){
  const v = (raw || '').toString().trim();
  if(!v) return '';
  return PENDIDIKAN_OPTIONS.find(o => o.toLowerCase() === v.toLowerCase()) || v;
}
function normalizeStatusPekerjaan(raw){
  const v = (raw || '').toString().trim();
  if(!v) return '';
  return STATUS_OPTIONS.find(o => o.toLowerCase() === v.toLowerCase()) || '';
}
function normalizeTanggalLahir(raw){
  const v = (raw || '').toString().trim();
  if(!v) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  let d = null;
  const dmy = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(dmy) d = new Date(Number(dmy[3]), Number(dmy[2]) - 1, Number(dmy[1]));
  else d = new Date(v);
  if(!d || isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function extractBulanTahun(tanggalSuratText, fallbackIsoDate){
  if(tanggalSuratText){
    const bulanPattern = BULAN_NAMES.join('|');
    const m = String(tanggalSuratText).match(new RegExp('(\\d{1,2})\\s+(' + bulanPattern + ')\\s+(\\d{4})', 'i'));
    if(m){
      const bulanIdx = BULAN_NAMES.findIndex(b => b.toLowerCase() === m[2].toLowerCase());
      if(bulanIdx !== -1) return { bulan: bulanIdx + 1, tahun: parseInt(m[3], 10) };
    }
    const isoMatch = String(tanggalSuratText).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(isoMatch) return { bulan: parseInt(isoMatch[2], 10), tahun: parseInt(isoMatch[1], 10) };
  }
  if(fallbackIsoDate){
    const d = new Date(fallbackIsoDate);
    if(!isNaN(d.getTime())) return { bulan: d.getMonth() + 1, tahun: d.getFullYear() };
  }
  return null;
}

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  if(typeof XLSX === 'undefined'){ alert('Modul Excel belum siap.'); e.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = async (evt) => {
    try{
      const wb = XLSX.read(new Uint8Array(evt.target.result), { type:'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });
      if(rows.length === 0){ alert('File kosong atau format tidak sesuai template.'); return; }
      let imported = 0, skipped = 0;
      rows.forEach(row => {
        const nama = (row['Nama Pegawai'] || row['Nama Staf'] || row['Nama'] || '').toString().trim();
        if(!nama || /^(contoh|catatan)/i.test(nama)){ skipped++; return; }
        state.staff.push({
          id: uid(), nama,
          nip: (row['NIP'] || '').toString().trim(),
          tempatLahir: '', tanggalLahir: normalizeTanggalLahir(row['Tanggal Lahir']), email: '',
          jenisKelamin: normalizeJenisKelamin(row['Jenis Kelamin']),
          pendidikan: normalizePendidikan(row['Pendidikan']),
          profesi: (row['Profesi'] || '').toString().trim(),
          statusPekerjaan: normalizeStatusPekerjaan(row['Status']),
          jabatanSK: (row['Jabatan Sesuai SK'] || '').toString().trim(),
          jabatanRuangan: (row['Jabatan Saat Ini'] || '').toString().trim(),
          keterangan: '',
          nomorSTR: (row['Nomor STR'] || '').toString().trim(), tglKadaluarsaSTR: '', linkDokumenSTR: '',
          nomorSIPA: (row['Nomor SIPA'] || '').toString().trim(), tglKadaluarsaSIPA: '', linkDokumenSIPA: ''
        });
        imported++;
      });
      if(imported > 0) await saveData();
      render();
      alert(`Berhasil mengimpor ${imported} data staf.${skipped > 0 ? ` (${skipped} baris dilewati)` : ''}`);
    }catch(err){
      console.error('Gagal impor file', err);
      alert('Gagal membaca file. Gunakan template yang disediakan.');
    }finally{ e.target.value = ''; }
  };
  reader.readAsArrayBuffer(file);
}

const HASH_FOR_SCREEN = { 'landing': '', 'dashboard': 'database-staf', 'cuti': 'cuti-staf', 'rekap-cuti': 'rekap-cuti', 'informasi-surat': 'informasi-surat' };
const SCREEN_FOR_HASH = Object.fromEntries(Object.entries(HASH_FOR_SCREEN).map(([k,v]) => [v,k]));
function syncUrlHash(){
  const wanted = HASH_FOR_SCREEN[state.screen] || '';
  const current = location.hash.replace('#','');
  if(current !== wanted) history.replaceState(null, '', location.pathname + location.search + (wanted ? '#' + wanted : ''));
}
async function copyPageLink(btn){
  const wanted = HASH_FOR_SCREEN[state.screen] || '';
  const url = location.origin + location.pathname + '?shared=1' + (wanted ? '#' + wanted : '');
  const originalText = btn.textContent;
  try{ await navigator.clipboard.writeText(url); btn.textContent = '✓ Link tersalin'; }
  catch(e){ window.prompt('Salin link ini secara manual:', url); }
  setTimeout(() => { btn.textContent = originalText; }, 2000);
}

function getFiltered(){
  const q = state.search.trim().toLowerCase();
  return state.staff.filter(s => {
    if(state.filterStatus && s.statusPekerjaan !== state.filterStatus) return false;
    if(state.filterPendidikan && s.pendidikan !== state.filterPendidikan) return false;
    if(state.filterProfesi === 'Apoteker'){
      const isApoteker =
        (s.profesi || '').trim().toLowerCase() === 'apoteker' ||
        (s.pendidikan || '').trim().toLowerCase() === 's2 farmasi + apoteker';
      if(!isApoteker) return false;
    } else if(state.filterProfesi && (s.profesi||'').trim().toLowerCase() !== state.filterProfesi.toLowerCase()) return false;
    if(!q) return true;
    const hay = [s.nama, s.nip, s.email, s.jabatanSK, s.jabatanRuangan, s.tempatLahir].join(' ').toLowerCase();
    return hay.includes(q);
  }).sort((a,b) => (a.nama||'').localeCompare(b.nama||''));
}
function computeStats(){
  const total = state.staff.length;
  const byStatus = {};
  STATUS_OPTIONS.forEach(s => byStatus[s] = 0);
  state.staff.forEach(s => { if(byStatus[s.statusPekerjaan] !== undefined) byStatus[s.statusPekerjaan]++; });
  const perempuan = state.staff.filter(s => s.jenisKelamin === 'P').length;
  const lakiLaki = state.staff.filter(s => s.jenisKelamin === 'L').length;
  const byProfesi = {};
  PROFESI_CATEGORIES.forEach(p => byProfesi[p] = 0);
  state.staff.forEach(s => {
    if((s.pendidikan || '').trim().toLowerCase() === 's2 farmasi + apoteker'){ byProfesi['Apoteker']++; return; }
    const p = (s.profesi || '').trim();
    const matched = PROFESI_CATEGORIES.find(c => c.toLowerCase() === p.toLowerCase());
    if(matched) byProfesi[matched]++;
  });
  return { total, byStatus, perempuan, lakiLaki, byProfesi };
}

function computeRekapCuti(year){
  const map = {};
  state.cutiStaf.forEach(entry => {
    const start = parseDateLocal(entry.tglMulai);
    if(!start || start.getFullYear() !== year) return;
    const key = (entry.namaPetugas || '').trim().toLowerCase() + '|' + (entry.depoRuangan || '').trim().toLowerCase();
    if(!map[key]){
      map[key] = { namaPetugas: entry.namaPetugas, depoRuangan: entry.depoRuangan, pengajuan: 0, total: 0, breakdown: {} };
      KETERANGAN_CUTI_OPTIONS.forEach(k => { map[key].breakdown[k] = 0; });
    }
    const days = countCutiDays(entry, state.liburNasional);
    map[key].total += days; map[key].pengajuan++;
    if(map[key].breakdown[entry.keterangan] !== undefined) map[key].breakdown[entry.keterangan] += days;
  });
  return Object.values(map).sort((a,b) => (a.namaPetugas||'').localeCompare(b.namaPetugas||''));
}

      const s = state.suratList.find(x => x.id === btn.getAttribute('data-preview-tindaklanjut'));

    const fileInput = document.querySelector(`[data-file-asli-input="${id}"]`);

    btn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if(!file) return;
      if(file.size > SURAT_MAX_SIZE_BYTES){ alert(`Ukuran file melebihi batas 10 MB.`); return; }

      if(!s) return;
      const statusEl = document.querySelector(`[data-asli-status="${id}"]`);
      btn.disabled = true;
      if(statusEl) statusEl.textContent = 'Mengunggah…';
      try{
        const base64 = await fileToBase64(file);

        if(result.url){
          s.linkFileAsli = result.url;
          s.fileIdAsli = result.fileId || '';
          await saveSuratList();
          render();
        } else {

          alert(`Gagal: ${result.error || 'tidak diketahui'}`);
          btn.disabled = false;
        }

  document.querySelectorAll('[data-upload-tindaklanjut]').forEach(btn => {

      e.target.value = '';

      if(!SHEETS_API_URL){ alert('Upload otomatis ke Google Drive belum aktif.'); return; }
      const s = state.suratList.find(x => x.id === id);
      if(!s) return;
      const statusEl = document.querySelector(`[data-tindaklanjut-status="${id}"]`);
      btn.disabled = true;
      if(statusEl) statusEl.textContent = 'Mengunggah…';
      try{
        const base64 = await fileToBase64(file);
        const result = await uploadFileToDrive(base64, file.name, 'tindaklanjut', file.type || 'application/octet-stream');
        if(result.url){
          s.linkHasilTindaklanjut = result.url;
          s.fileIdHasilTindaklanjut = result.fileId || '';
          s.namaFileHasilTindaklanjut = file.name;
          await saveSuratList();
          render();
        } else {
          if(statusEl) statusEl.textContent = '';
          alert(`Gagal: ${result.error || 'tidak diketahui'}`);
          btn.disabled = false;
        }
      }catch(err){ console.error(err); if(statusEl) statusEl.textContent = ''; alert('Gagal mengunggah file.'); btn.disabled = false; }
    });
  });

  document.querySelectorAll('[data-surat-status]').forEach(sel => {
    sel.addEventListener('change', async () => {
      const s = state.suratList.find(x => x.id === sel.getAttribute('data-surat-status'));
      if(!s) return;
      s.keteranganStatus = sel.value;
      await saveSuratList();
    });
  });
  document.querySelectorAll('[data-posisi-surat]').forEach(input => {
    input.addEventListener('change', async () => {
      const s = state.suratList.find(x => x.id === input.getAttribute('data-posisi-surat'));
      if(!s) return;
      s.posisiSurat = input.value.trim();
      await saveSuratList();
    });
  });
  document.querySelectorAll('[data-edit-surat]').forEach(btn => {
    btn.addEventListener('click', () => { state.suratEditingId = btn.getAttribute('data-edit-surat'); state.modal = 'surat-edit'; render(); });
  });
  document.querySelectorAll('[data-delete-surat]').forEach(btn => {
    btn.addEventListener('click', () => { state.suratDeletingId = btn.getAttribute('data-delete-surat'); state.modal = 'surat-delete'; render(); });
  });
}

function renderSuratDeleteModal(){

  wrap.id = 'overlay';

      <button class="close-x" id="modal-close">×</button>

      <div class="modal-actions">
        <button class="btn secondary" id="delete-cancel">Batal</button>

      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  const cancel = () => {
    const o = document.getElementById('overlay'); if(o) o.remove();
    state.modal = null; state.suratDeletingId = null; render();
  };
  document.getElementById('modal-close').addEventListener('click', cancel);
  document.getElementById('delete-cancel').addEventListener('click', cancel);
  wrap.addEventListener('click', e => { if(e.target.id === 'overlay') cancel(); });
  document.getElementById('delete-confirm').addEventListener('click', async () => {
    const id = state.suratDeletingId;

    state.suratList = state.suratList.filter(x => x.id !== id);
    await saveSuratList();

        for(let i = 0; i < entry.fileChunks; i++) await window.storage.delete(`surat-file:${id}:${i}`, true);

      <form id="staff-form">
        <div class="field"><label>Nama staf</label><input type="text" id="f-nama" value="${escapeHtml(s.nama)}" required></div>
        <div class="field"><label>NIP <span class="opt-tag">(Opsional)</span></label><input type="text" id="f-nip" value="${escapeHtml(s.nip)}"></div>
        <div class="grid2">
          <div class="field"><label>Tempat lahir <span class="opt-tag">(Opsional)</span></label><input type="text" id="f-tempat" value="${escapeHtml(s.tempatLahir)}"></div>
          <div class="field"><label>Tanggal lahir <span class="opt-tag">(Opsional)</span></label><input type="date" id="f-tanggal" value="${escapeHtml(dateOnly(s.tanggalLahir))}"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Email <span class="opt-tag">(Opsional)</span></label><input type="email" id="f-email" value="${escapeHtml(s.email)}"></div>
          <div class="field"><label>Jenis kelamin <span class="opt-tag">(Opsional)</span></label>
            <select id="f-jk">
              <option value="">Pilih…</option>
              <option value="L" ${s.jenisKelamin==='L'?'selected':''}>Laki-laki</option>
              <option value="P" ${s.jenisKelamin==='P'?'selected':''}>Perempuan</option>
            </select>
          </div>
        </div>
        <div class="grid2">
          <div class="field"><label>Kualifikasi pendidikan <span class="opt-tag">(Opsional)</span></label>
            <select id="f-pendidikan">
              <option value="">Pilih…</option>
              ${PENDIDIKAN_OPTIONS.map(o => `<option value="${escapeHtml(o)}" ${s.pendidikan===o?'selected':''}>${o}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Profesi <span class="opt-tag">(Opsional)</span></label><input type="text" id="f-profesi" value="${escapeHtml(s.profesi)}"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Status pekerjaan <span class="opt-tag">(Opsional)</span></label>
            <select id="f-status">
              <option value="">Pilih…</option>
              ${STATUS_OPTIONS.map(o => `<option value="${escapeHtml(o)}" ${s.statusPekerjaan===o?'selected':''}>${o}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="grid2">
          <div class="field"><label>Jabatan sesuai SK <span class="opt-tag">(Opsional)</span></label><input type="text" id="f-jabatan-sk" value="${escapeHtml(s.jabatanSK)}"></div>
          <div class="field"><label>Jabatan di ruangan <span class="opt-tag">(Opsional)</span></label><input type="text" id="f-jabatan-ruangan" value="${escapeHtml(s.jabatanRuangan)}"></div>
        </div>
        <div class="field"><label>Keterangan <span class="opt-tag">(Opsional)</span></label><textarea id="f-keterangan">${escapeHtml(s.keterangan)}</textarea></div>

        <hr style="border:none; border-top:1px solid var(--line); margin:18px 0 16px;">
        <p class="hint" style="margin-bottom:14px; font-weight:600; color:var(--teal-2);">Legalitas Profesi <span class="opt-tag" style="font-weight:400;">(Opsional)</span></p>
        <div class="grid2">
          <div class="field"><label>Nomor STR</label><input type="text" id="f-nomor-str" value="${escapeHtml(s.nomorSTR)}"></div>
          <div class="field">
            <label>Tanggal kadaluarsa STR</label>
            <input type="date" id="f-tgl-str" value="${escapeHtml(dateOnly(s.tglKadaluarsaSTR))}" ${s.tglKadaluarsaSTR === 'SEUMUR_HIDUP' ? 'disabled' : ''}>
            <label style="display:flex; align-items:center; gap:6px; margin-top:6px; font-weight:400; font-size:12.5px; color:var(--ink-soft); cursor:pointer;">
              <input type="checkbox" id="f-str-seumur-hidup" ${s.tglKadaluarsaSTR === 'SEUMUR_HIDUP' ? 'checked' : ''} style="width:auto; margin:0;">
              STR Seumur Hidup
            </label>
          </div>
        </div>
        <div class="field">
          <label>Scan STR <span class="opt-tag">(Opsional)</span></label>
          <div class="doc-box">
            <div id="doc-row-str"></div>
            <div class="sub" id="upload-str-status"></div>
            <button type="button" class="link-manual-toggle" id="toggle-manual-str">atau tempel link manual</button>
            <input type="url" id="f-link-str" value="${escapeHtml(s.linkDokumenSTR)}" placeholder="https://drive.google.com/…" style="display:none; margin-top:6px;">
          </div>
          <input type="file" id="file-upload-str" accept=".pdf,.jpg,.jpeg,.png" style="display:none;">
          <input type="hidden" id="f-fileid-str" value="${escapeHtml(s.fileIdSTR)}">
        </div>
        <div class="grid2">
          <div class="field"><label>Nomor SIPA</label><input type="text" id="f-nomor-sipa" value="${escapeHtml(s.nomorSIPA)}"></div>
          <div class="field"><label>Tanggal kadaluarsa SIPA</label><input type="date" id="f-tgl-sipa" value="${escapeHtml(dateOnly(s.tglKadaluarsaSIPA))}"></div>
        </div>
        <div class="field">
          <label>Scan SIPA <span class="opt-tag">(Opsional)</span></label>
          <div class="doc-box">
            <div id="doc-row-sipa"></div>
            <div class="sub" id="upload-sipa-status"></div>
            <button type="button" class="link-manual-toggle" id="toggle-manual-sipa">atau tempel link manual</button>
            <input type="url" id="f-link-sipa" value="${escapeHtml(s.linkDokumenSIPA)}" placeholder="https://drive.google.com/…" style="display:none; margin-top:6px;">
          </div>
          <input type="file" id="file-upload-sipa" accept=".pdf,.jpg,.jpeg,.png" style="display:none;">
          <input type="hidden" id="f-fileid-sipa" value="${escapeHtml(s.fileIdSIPA)}">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="form-cancel">Batal</button>
          <button type="submit" class="btn">${editing ? 'Simpan Perubahan' : 'Tambah Staf'}</button>
        </div>
      </form>
    </div>
  `;
  document.body.appendChild(wrap);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('form-cancel').addEventListener('click', closeModal);
  wrap.addEventListener('click', e => { if(e.target.id === 'overlay') closeModal(); });
  document.getElementById('f-nama').focus();

  const chkSeumurHidupStr = document.getElementById('f-str-seumur-hidup');
  const tglStrInput = document.getElementById('f-tgl-str');
  if(chkSeumurHidupStr && tglStrInput){
    chkSeumurHidupStr.addEventListener('change', () => {
      if(chkSeumurHidupStr.checked){ tglStrInput.value = ''; tglStrInput.disabled = true; }
      else { tglStrInput.disabled = false; }
    });
  }

  function wireDocUpload(rowId, fileInputId, linkInputId, fileIdInputId, statusId, toggleId, docType, label){
    const fileInput = document.getElementById(fileInputId);
    const linkInput = document.getElementById(linkInputId);
    const fileIdInput = document.getElementById(fileIdInputId);
    const toggleBtn = document.getElementById(toggleId);
    const statusEl = document.getElementById(statusId);
    if(!fileInput || !linkInput) return;

    function renderRow(){
      const row = document.getElementById(rowId);
      const hasLink = !!linkInput.value;
      row.innerHTML = hasLink ? `
        <span class="doc-chip">📄 File tersimpan</span>
        <button type="button" class="btn secondary small" data-act="view">Lihat File</button>
        <button type="button" class="btn secondary small" data-act="replace">Ganti File</button>
      ` : `<button type="button" class="btn secondary small" data-act="upload">⬆ ${label}</button>`;
      const viewBtn = row.querySelector('[data-act="view"]');
      const replaceBtn = row.querySelector('[data-act="replace"]');
      const uploadBtn = row.querySelector('[data-act="upload"]');
      if(viewBtn) viewBtn.addEventListener('click', () => openFilePreviewModal(fileIdInput.value || linkInput.value, linkInput.value));
      if(replaceBtn) replaceBtn.addEventListener('click', () => fileInput.click());
      if(uploadBtn) uploadBtn.addEventListener('click', () => fileInput.click());
    }

    if(toggleBtn){
      toggleBtn.addEventListener('click', () => {
        linkInput.style.display = linkInput.style.display === 'none' ? 'block' : 'none';
      });
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0]; e.target.value = '';
      if(!file) return;
      if(!SHEETS_API_URL){ alert('Upload otomatis belum aktif.'); return; }
      if(file.size > SURAT_MAX_SIZE_BYTES){ alert('Ukuran melebihi 10 MB.'); return; }
      if(statusEl) statusEl.textContent = 'Mengunggah…';
      try{
        const base64 = await fileToBase64(file);
        const result = await uploadFileToDrive(base64, file.name, docType, file.type || 'application/octet-stream');
        if(result.url){
          linkInput.value = result.url; fileIdInput.value = result.fileId || '';
          if(statusEl) statusEl.textContent = '✓ Berhasil diupload.';
          renderRow();
        } else {
          if(statusEl) statusEl.textContent = '';
          alert(`Gagal: ${result.error || 'tidak diketahui'}`);
        }
      }catch(err){ console.error(err); if(statusEl) statusEl.textContent = ''; alert('Gagal mengunggah.'); }
    });

    renderRow();
  }
  wireDocUpload('doc-row-str', 'file-upload-str', 'f-link-str', 'f-fileid-str', 'upload-str-status', 'toggle-manual-str', 'str', 'Upload Scan STR');
  wireDocUpload('doc-row-sipa', 'file-upload-sipa', 'f-link-sipa', 'f-fileid-sipa', 'upload-sipa-status', 'toggle-manual-sipa', 'sipa', 'Upload Scan SIPA');

  document.getElementById('staff-form').addEventListener('submit', async e => {
    e.preventDefault();
    const data = {
      nama: document.getElementById('f-nama').value.trim(),
      nip: document.getElementById('f-nip').value.trim(),
      tempatLahir: document.getElementById('f-tempat').value.trim(),
      tanggalLahir: document.getElementById('f-tanggal').value,
      email: document.getElementById('f-email').value.trim(),
      jenisKelamin: document.getElementById('f-jk').value,
      pendidikan: document.getElementById('f-pendidikan').value,
      profesi: document.getElementById('f-profesi').value.trim(),
      statusPekerjaan: document.getElementById('f-status').value,
      jabatanSK: document.getElementById('f-jabatan-sk').value.trim(),
      jabatanRuangan: document.getElementById('f-jabatan-ruangan').value.trim(),
      keterangan: document.getElementById('f-keterangan').value.trim(),
      nomorSTR: document.getElementById('f-nomor-str').value.trim(),
      tglKadaluarsaSTR: document.getElementById('f-str-seumur-hidup').checked ? 'SEUMUR_HIDUP' : document.getElementById('f-tgl-str').value,
      linkDokumenSTR: document.getElementById('f-link-str').value.trim(),
      fileIdSTR: document.getElementById('f-fileid-str').value.trim(),
      nomorSIPA: document.getElementById('f-nomor-sipa').value.trim(),
      tglKadaluarsaSIPA: document.getElementById('f-tgl-sipa').value,
      linkDokumenSIPA: document.getElementById('f-link-sipa').value.trim(),
      fileIdSIPA: document.getElementById('f-fileid-sipa').value.trim()
    };
    if(!data.nama){ alert('Nama staf wajib diisi.'); return; }
    if(editing){
      const idx = state.staff.findIndex(x => x.id === editing.id);
      state.staff[idx] = { ...editing, ...data };
    } else {
      state.staff.push({ id: uid(), ...data });
    }
    closeModal();
    await saveData();
    render();
  });
}

function renderDeleteModal(){
  const s = state.staff.find(x => x.id === state.deletingId);
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'overlay';
  wrap.innerHTML = `
    <div class="modal" style="max-width:400px;">
      <button class="close-x" id="modal-close">×</button>
      <h2>Hapus data staf?</h2>
      <p class="hint">Data <strong>${escapeHtml(s ? s.nama : '')}</strong> akan dihapus permanen.</p>
      <div class="modal-actions">
        <button class="btn secondary" id="delete-cancel">Batal</button>
        <button class="btn danger" id="delete-confirm" style="background:var(--danger); color:#fff; border-color:var(--danger);">Ya, Hapus</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('delete-cancel').addEventListener('click', closeModal);
  wrap.addEventListener('click', e => { if(e.target.id === 'overlay') closeModal(); });
  document.getElementById('delete-confirm').addEventListener('click', async () => {
    state.staff = state.staff.filter(x => x.id !== state.deletingId);
    closeModal();
    await saveData();
    render();
  });
}

function closeModal(){
  const o = document.getElementById('overlay'); if(o) o.remove();
  state.modal = null; state.editingId = null; state.deletingId = null;
  render();
}

(function applyInitialHash(){
  const hash = location.hash.replace('#','');
  if(hash && SCREEN_FOR_HASH[hash]) state.screen = SCREEN_FOR_HASH[hash];
  if(new URLSearchParams(location.search).has('shared')){
    state.restrictedShare = true;
    state.restrictedScreen = state.screen;
  }
})();
window.addEventListener('hashchange', () => {
  if(state.restrictedShare){
    if(location.hash.replace('#','') !== (HASH_FOR_SCREEN[state.restrictedScreen] || '')) syncUrlHash();
  }
});
loadData();
</script>
</body>
</html>
